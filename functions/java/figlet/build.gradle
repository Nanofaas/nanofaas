plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id 'org.graalvm.buildtools.native' version "${graalvmBuildToolsVersion}"
    id 'java'
}

apply from: rootProject.file('gradle/spring-aot-native-only.gradle')

dependencies {
    implementation project(':sdks:java')
    implementation 'com.github.lalyos:jfiglet:0.0.9'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = 'figlet.jar'
}

bootBuildImage {
    doFirst {
        throw new GradleException('Native buildpacks are disabled; run scripts/native-java-image.sh figlet instead')
    }
}
