paths:
  /v1/admin/runtime-config:
    get:
      summary: Get the current runtime configuration snapshot
      description: Available only when `nanofaas.admin.runtime-config.enabled=true`.
      operationId: getRuntimeConfig
      responses:
        '200':
          description: Current runtime configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigSnapshot'
        '404':
          description: Admin runtime-config API is disabled
  /v1/admin/runtime-config/{namespace}:
    parameters:
      - $ref: '#/components/parameters/RuntimeConfigNamespace'
    get:
      summary: Get one runtime configuration namespace
      responses:
        '200':
          description: Current namespace configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                scheduler:
                  summary: The scheduler namespace (present only when an engine exposing it is built in)
                  value:
                    strategy: per-function
                    available: [per-function, shared-queue]
                    persistence: restart
        '404':
          description: Namespace or admin runtime-config API not found
    patch:
      summary: Patch one runtime configuration namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfigPatchRequest'
            examples:
              schedulerSwitch:
                summary: Switch the active scheduling strategy
                value:
                  expectedRevision: 0
                  values:
                    strategy: shared-queue
      responses:
        '200':
          description: >-
            Runtime configuration updated and applied. Only returned after the change has
            committed — for the `scheduler` namespace, only after
            `SchedulerControl#switchTo` has actually activated the new strategy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigPatchResponse'
        '400':
          description: Request body is missing `expectedRevision` or `values`
        '404':
          description: Namespace or admin runtime-config API not found
        '409':
          description: Revision mismatch; retry with the current revision from GET
        '422':
          description: Validation failed (for `scheduler`, an id not in `available`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '503':
          description: >-
            The change did not commit: it was refused at or before its commit point (a
            prepare/apply failure, or the admin request queue was full) and no new revision
            was published. For the `scheduler` namespace that is the whole story — a switch is
            not a partial update, so a refused one simply leaves the previous strategy active
            and there is nothing to roll back — while a namespace on the legacy restore
            semantics attempts its own restore first. Retry is safe.
  /v1/admin/runtime-config/{namespace}/validate:
    parameters:
      - $ref: '#/components/parameters/RuntimeConfigNamespace'
    post:
      summary: Validate a runtime configuration namespace patch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Patch is valid
        '404':
          description: Namespace or admin runtime-config API not found
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

components:
  parameters:
    RuntimeConfigNamespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
  schemas:
    RuntimeConfigPatchRequest:
      type: object
      required: [expectedRevision, values]
      properties:
        expectedRevision:
          type: integer
          format: int64
        values:
          type: object
          description: |
            Partial namespace patch. The `control-plane` namespace supports
            `rateMaxPerSecond` plus the global/per-function execution,
            canonical-input, physical-input-copy and waiter limits. Reducing a
            limit below occupancy never evicts live work; new reservations pause
            until usage drains below the replacement limit.

            The `scheduler` namespace (present only when the built artifact composes an
            engine exposing `SchedulerControl`) accepts exactly one field, `strategy`,
            which must be one of the namespace's own `available` ids. The switch takes
            effect immediately, in both directions, without draining pending work or
            restarting; it does not persist across a restart (`persistence: restart`
            in the GET response means exactly that — the configured startup strategy
            wins again on the next boot).
          additionalProperties: true
    SchedulerNamespace:
      type: object
      description: >-
        The `scheduler` namespace as returned by GET
        `/v1/admin/runtime-config/scheduler`, and the effective shape reflected under
        `namespaces.scheduler` after a successful PATCH.
      required: [strategy, available, persistence]
      properties:
        strategy:
          type: string
          enum: [per-function, shared-queue]
          description: The currently active scheduling strategy.
        available:
          type: array
          items:
            type: string
            enum: [per-function, shared-queue]
          description: Every strategy id this build was composed with, including `strategy`.
        persistence:
          type: string
          enum: [restart]
          description: A manual switch does not survive a restart; startup config wins again.
    RuntimeConfigSnapshot:
      type: object
      required: [revision, namespaces]
      properties:
        revision:
          type: integer
          format: int64
        namespaces:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
    RuntimeConfigPatchResponse:
      type: object
      required: [revision, effectiveConfig, appliedAt, changeId, warnings]
      properties:
        revision:
          type: integer
          format: int64
        effectiveConfig:
          $ref: '#/components/schemas/RuntimeConfigSnapshot'
        appliedAt:
          type: string
          format: date-time
        changeId:
          type: string
        warnings:
          type: array
          items:
            type: string
    ValidationErrors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: string
