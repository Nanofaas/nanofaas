name: qr-code-javascript
image: nanofaas/qr-code:latest
timeoutMs: 10000
concurrency: 2
executionMode: DEPLOYMENT

x-cli:
  build:
    context: ../../..
    dockerfile: functions/javascript/qr-code/Dockerfile
    platform: linux/amd64
    push: true

catalog:
  family: qr-code
  runtime: javascript
  description: Node.js PNG QR code generation demo.
  defaultImage: localhost:5000/nanofaas/javascript-qr-code:e2e
  defaultPayload: qr-code-sample.json
