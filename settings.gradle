pluginManagement {
    includeBuild('platform/gradle-plugin')
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'org.graalvm.buildtools.native' && requested.version != null) {
                useModule("org.graalvm.buildtools:native-gradle-plugin:${requested.version}")
            }
        }
    }

    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    // Build health / dependency analysis for all projects (settings plugin since 2.0).
    id 'com.autonomousapps.build-health' version '3.18.0'
    id 'it.unimib.datai.nanofaas.control-plane-modules'
}

rootProject.name = 'nanofaas'

include('common');            project(':common').projectDir = file('platform/common')
include(':sdks:java');        project(':sdks:java').projectDir = file('sdks/java')
include('control-plane');     project(':control-plane').projectDir = file('platform/control-plane')
include(':services:java:warm-echo'); project(':services:java:warm-echo').projectDir = file('services/java/warm-echo')
include('nanofaas-cli');      project(':nanofaas-cli').projectDir = file('clients/cli')
include(':sdks:java-lite');   project(':sdks:java-lite').projectDir = file('sdks/java-lite')
include('functions:java:word-stats')
include('functions:java:json-transform')
include('functions:java:word-stats-lite')
include('functions:java:json-transform-lite')

include 'functions:java:roman-numeral'
include 'functions:java:roman-numeral-lite'
include 'functions:java:figlet'
include 'functions:java:qr-code'
include 'functions:java:handler-envelope'
include 'functions:java:binary-envelope'
