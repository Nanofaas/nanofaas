name: nanoFaaS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test-java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_containerdMavenLocal: 'true'
      GRADLE_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.gradle/containerd-m2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - name: Read containerd dependency revisions
        id: containerd-dependencies
        run: |
          source deploy/containerd-rootless/dependencies.env
          printf 'libcni=%s\ncontainerd=%s\n' "$LIBCNI_JAVA_REV" "$CONTAINERD_JAVA_REV" >> "$GITHUB_OUTPUT"
      - name: Check out libcni-java
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nanofaas/libcni-java
          ref: ${{ steps.containerd-dependencies.outputs.libcni }}
          path: .gradle/ci-sources/libcni-java
      - name: Check out containerd-java
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nanofaas/containerd-java
          ref: ${{ steps.containerd-dependencies.outputs.containerd }}
          path: .gradle/ci-sources/containerd-java
      - name: Build containerd dependencies
        run: bash scripts/bootstrap-containerd-dependencies.sh .gradle/ci-sources/libcni-java .gradle/ci-sources/containerd-java
      # --continue: one failing module must not hide the others' results.
      - name: Run Tests
        run: ./gradlew test --continue

      - name: Run release checks
        run: ./gradlew releaseChecks -PcontrolPlaneModules=all --continue

      - name: Run P2P Tests
        run: ./gradlew :control-plane-modules:p2p-discovery:test -PcontrolPlaneModules=all

      # The suite above now runs with every optional module loaded, which is what
      # ships. CoreOnlyApiTest asserts the opposite configuration — no-op enqueuer,
      # 501 on :enqueue — and self-skips whenever async-queue is on the classpath,
      # so it needs its own invocation. Module selection happens at configuration
      # time and cannot be varied inside a single build.
      - name: Run Core-Only Tests
        run: ./gradlew :control-plane:test -PcontrolPlaneModules=none --tests '*CoreOnlyApiTest' --tests '*P07ConfiguredHttpCalibrationTest'

      # Both queues are enabled by default; concurrency-control selects sync
      # when both are present. Run each provider explicitly to cover both governors.
      - name: Run Async-Queue Concurrency Tests
        run: ./gradlew :control-plane-modules:concurrency-control:test -PcontrolPlaneModules=async-queue,concurrency-control,runtime-config

      - name: Run Sync-Queue Concurrency Tests
        run: ./gradlew :control-plane-modules:concurrency-control:test :control-plane-modules:sync-queue:test -PcontrolPlaneModules=sync-queue,concurrency-control,runtime-config

      # CI-only failures are otherwise undiagnosable: the log carries only the exception class and line.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-java-reports-${{ github.run_attempt }}
          path: |
            **/build/test-results/test/*.xml
            **/build/test-diagnostics/
            **/build/reports/spotbugs/
          retention-days: 14

  # The released control-plane native artifact must be an executable, not a shared library.
  # Java-lite's unused native target has a separate artifact decision. See ADR 238.
  test-native-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # For the Gradle cache and the wrapper only: the native compile itself must run on the
      # repository's pinned GraalVM, installed below and put in JAVA_HOME.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Install the pinned GraalVM
        run: |
          arch=amd64
          if [ "$(uname -m)" = "aarch64" ]; then arch=arm64; fi
          # Positional, in the script's own order: <architecture> <release> <java_version>
          # [distribution]. The distribution is last; passing it first builds the case string
          # $distribution:$release:$java_version:$architecture against the wrong field and lands
          # on the *) arm.
          sudo sh scripts/install-graalvm.sh "$arch" \
            "$(sed -n 's/^graalvmVersion=//p' gradle.properties)" \
            "$(sed -n 's/^graalvmJavaVersion=//p' gradle.properties)" community
          echo "JAVA_HOME=/opt/graalvm" >> "$GITHUB_ENV"
          echo "/opt/graalvm/bin" >> "$GITHUB_PATH"
      - name: Read containerd dependency revisions
        id: containerd-dependencies
        run: |
          source deploy/containerd-rootless/dependencies.env
          printf 'libcni=%s\ncontainerd=%s\n' "$LIBCNI_JAVA_REV" "$CONTAINERD_JAVA_REV" >> "$GITHUB_OUTPUT"
      - name: Check out libcni-java
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nanofaas/libcni-java
          ref: ${{ steps.containerd-dependencies.outputs.libcni }}
          path: .gradle/ci-sources/libcni-java
      - name: Check out containerd-java
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nanofaas/containerd-java
          ref: ${{ steps.containerd-dependencies.outputs.containerd }}
          path: .gradle/ci-sources/containerd-java
      - name: Build containerd dependencies
        run: bash scripts/bootstrap-containerd-dependencies.sh .gradle/ci-sources/libcni-java .gradle/ci-sources/containerd-java
      - name: Compile the control plane natively
        run: ./gradlew :control-plane:nativeCompile -PcontrolPlaneModules=all
        env:
          ORG_GRADLE_PROJECT_containerdMavenLocal: 'true'
          GRADLE_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.gradle/containerd-m2
      - name: Assert the native artifact is an executable
        run: scripts/assert-native-executable.sh platform/control-plane/build/native/nativeCompile/control-plane
      - name: Verify native HTTP management errors
        run: python3 scripts/assert-native-api-errors.py platform/control-plane/build/native/nativeCompile/control-plane

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Run SDK and Example Tests
        run: |
          cd sdks/python
          uv run --python 3.12 --extra test --with-editable . python -m pytest tests/

  test-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-08-11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: runtimes/watchdog
      - name: Install integration-test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq netcat-openbsd
      - name: Run watchdog tests
        timeout-minutes: 15
        run: |
          cargo test --manifest-path runtimes/watchdog/Cargo.toml
          bash runtimes/watchdog/test-local.sh

  test-rust-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # One target directory for the SDK and the four functions, which share most dependencies.
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/cargo-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-08-11
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: sdks/rust -> ../../build/cargo-target
      - name: Check Rust SDK formatting and lints
        working-directory: sdks/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      # The SDK's conformance test runs sdks/runtime-contract/validate_saturation_wire_corpus.py
      # with the runner's python3.
      - name: Run Rust SDK and function tests
        run: |
          for directory in sdks/rust functions/rust/*/; do
            (cd "$directory" && cargo test)
          done

  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: |
            sdks/go/go.sum
            functions/go/*/go.sum
      # The SDK's corpus adapter runs the shared Python validator with the runner's python3.
      - name: Run Go SDK and function tests
        run: |
          for directory in sdks/go functions/go/*/; do
            (cd "$directory" && go test ./...)
          done

  test-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            sdks/javascript/package-lock.json
            functions/javascript/*/package-lock.json
      - name: Run JavaScript SDK tests
        working-directory: sdks/javascript
        run: |
          npm ci
          npm test
      # Each function's pretest installs and builds the SDK it links through file:.
      - name: Run JavaScript function tests
        run: |
          for directory in functions/javascript/*/; do
            (cd "$directory" && npm ci && npm test)
          done

  test-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - name: Install k6
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/k6.deb" https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.deb
          printf '%s  %s\n' e6540ad879fe7ad01ddfe2288d54ef842848a7c31efff1d92a9e07be80e702bc "$RUNNER_TEMP/k6.deb" | sha256sum --check
          sudo dpkg -i "$RUNNER_TEMP/k6.deb"
          k6 version
      - name: Run scripts and experiments tests
        run: uv run --python 3.12 --with pytest --with pyyaml python -m pytest scripts/tests experiments/tests sdks/runtime-contract -ra --junitxml=build/test-results/tools.xml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-08-11
      - name: Fetch Rust scaffold dependencies
        run: cargo fetch --locked --manifest-path sdks/rust/Cargo.toml
      - name: Run scaffolder tests
        run: uv run --python 3.12 --project tools/fn-init --group dev python -m pytest tools/fn-init/tests -ra --junitxml=build/test-results/scaffolder.xml
      - name: Upload tool test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-tools-reports
          path: build/test-results/*.xml
          if-no-files-found: error
          retention-days: 14

  release-gate:
    if: ${{ always() }}
    needs: [test-java, test-native-artifact, test-python, test-watchdog, test-rust-sdk, test-go, test-javascript, test-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          unsuccessful = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if not results or unsuccessful:
              print(f'Required verification jobs did not succeed: {unsuccessful}', file=sys.stderr)
              sys.exit(1)
          PY
