openapi: 3.0.3
info:
  title: nanofaas Control Plane API
  version: 0.19.0
  description: |
    Minimal FaaS control plane API for function registration and invocation.
servers:
  - url: /

paths:
  /v1/functions:
    get:
      summary: List functions
      operationId: listFunctions
      responses:
        '200':
          description: Function list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionResponse'
    post:
      summary: Register a function
      operationId: registerFunction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionSpec'
      responses:
        '201':
          description: Function registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
        '422':
          description: Image not found in registry
        '424':
          description: Image pull authentication required (configure imagePullSecrets)
        '503':
          description: Registry unavailable during image validation
        '409':
          description: Function already exists
  /v1/functions/{name}:
    get:
      summary: Get a function
      operationId: getFunction
      parameters:
        - $ref: '#/components/parameters/FunctionName'
      responses:
        '200':
          description: Function details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
        '404':
          description: Not found
    delete:
      summary: Delete a function
      operationId: deleteFunction
      parameters:
        - $ref: '#/components/parameters/FunctionName'
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  /v1/functions/{name}/replicas:
    get:
      summary: Get the managed replica status of a function
      operationId: getFunctionReplicaStatus
      parameters:
        - $ref: '#/components/parameters/FunctionName'
      responses:
        '200':
          description: Desired and ready replicas reported by the deployment backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicaStatusResponse'
        '400':
          description: The function does not use a managed deployment backend
        '404':
          description: Function not found
        '503':
          description: The deployment backend could not report replica status
    put:
      summary: Set the desired replica count of a function
      operationId: setFunctionReplicas
      parameters:
        - $ref: '#/components/parameters/FunctionName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplicaRequest'
      responses:
        '200':
          description: Desired replica count accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicaResponse'
        '400':
          description: Invalid replica count or unmanaged function
        '404':
          description: Function not found
        '503':
          description: The deployment backend could not set the replica count

  /v1/functions/{name}:invoke:
    post:
      summary: Invoke a function synchronously
      operationId: invokeFunctionSync
      parameters:
        - $ref: '#/components/parameters/FunctionName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TimeoutMs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationRequest'
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Function result
          headers:
            X-Execution-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Function not registered
        '408':
          description: Invocation timed out. The execution is terminal and will remain in `timeout` if later inspected via `GET /v1/executions/{executionId}`.
        '429':
          description: Too many requests. Returned for rate limiting and queue/admission backpressure on the synchronous invoke path.
        '500':
          description: Invocation failed
        '502':
          description: The invocation was offloaded to a remote instance and that instance failed. There is no local fallback.
        '504':
          description: The invocation was offloaded to a remote instance and that instance timed out.

  /v1/functions/{name}:enqueue:
    post:
      summary: Enqueue a function invocation asynchronously
      operationId: invokeFunctionAsync
      parameters:
        - $ref: '#/components/parameters/FunctionName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationRequest'
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnqueueResponse'
        '404':
          description: Function not registered
        '429':
          description: Too many requests. Returned for rate limiting or async queue saturation.
        '500':
          description: Enqueue failed
        '501':
          description: The async-queue module is not part of this build, so the asynchronous path is unavailable.

  /v1/executions/{executionId}:
    get:
      summary: Get execution status/result
      operationId: getExecution
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Execution status. Terminal values (`success`, `error`, `timeout`) are stable and are not rewritten by late callbacks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionStatus'
        '404':
          description: Not found

  /v1/admin/runtime-config:
    get:
      summary: Get the current runtime configuration snapshot
      description: Available only when `nanofaas.admin.runtime-config.enabled=true`.
      operationId: getRuntimeConfig
      responses:
        '200':
          description: Current runtime configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigSnapshot'
        '404':
          description: Admin runtime-config API is disabled
    patch:
      summary: Patch runtime configuration
      description: Available only when `nanofaas.admin.runtime-config.enabled=true`.
      operationId: patchRuntimeConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfigPatchRequest'
      responses:
        '200':
          description: Runtime configuration updated and applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigPatchResponse'
        '400':
          description: Malformed request. Duration fields must use ISO-8601 format such as `PT5S`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigParseError'
        '404':
          description: Admin runtime-config API is disabled
        '409':
          description: Revision mismatch
        '422':
          description: Validation failed for the effective runtime configuration after applying the patch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'
        '503':
          description: Configuration update was rolled back because applying it to live components failed

  /v1/admin/runtime-config/validate:
    post:
      summary: Validate a runtime configuration patch
      description: Available only when `nanofaas.admin.runtime-config.enabled=true`.
      operationId: validateRuntimeConfigPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfigPatchRequest'
      responses:
        '200':
          description: Patch is valid against the current effective configuration
        '400':
          description: Malformed request. Duration fields must use ISO-8601 format such as `PT5S`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfigParseError'
        '404':
          description: Admin runtime-config API is disabled
        '422':
          description: Validation failed for the effective runtime configuration after applying the patch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

components:
  parameters:
    FunctionName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z][a-zA-Z0-9._-]{0,62}$'
      description: Function name
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Client-provided key to deduplicate requests.
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
      description: Trace identifier propagated to function pods.
    TimeoutMs:
      name: X-Timeout-Ms
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 300000
      description: Max time in milliseconds for sync invocation.

  schemas:
    ReplicaRequest:
      type: object
      required: [replicas]
      properties:
        replicas:
          type: integer
          minimum: 0
    ReplicaResponse:
      type: object
      required: [function, replicas]
      properties:
        function:
          type: string
        replicas:
          type: integer
          minimum: 0
    ReplicaStatusResponse:
      type: object
      required: [name, desiredReplicas, readyReplicas]
      properties:
        name:
          type: string
        desiredReplicas:
          type: integer
          minimum: 0
        readyReplicas:
          type: integer
          minimum: 0
    FunctionSpec:
      type: object
      required: [name, image]
      properties:
        name:
          type: string
          description: Function name
        image:
          type: string
          description: Container image for the function runtime
        command:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        resources:
          $ref: '#/components/schemas/ResourceSpec'
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 300000
        concurrency:
          type: integer
          minimum: 1
          description: Max concurrent in-flight invocations for this function
        maxRetries:
          type: integer
          minimum: 0
          default: 3
          description: Number of retries for failed invocations (default 3)
        endpointUrl:
          type: string
          description: HTTP endpoint of the function, required for EXTERNAL execution mode
        executionMode:
          type: string
          enum: [LOCAL, EXTERNAL, DEPLOYMENT]
          description: Execution mode for the function (DEPLOYMENT is default)
        runtimeMode:
          type: string
          enum: [HTTP, STDIO, FILE]
          description: |
            How the watchdog interacts with the function process:
            Omit to preserve the image's own watchdog default.
            - HTTP: Function exposes HTTP server (Java Spring, Python FastAPI)
            - STDIO: Function reads stdin JSON, writes stdout JSON (scripts)
            - FILE: Function reads input file, writes output file (Bash, binaries)
        runtimeCommand:
          type: string
          description: |
            Custom command to run the function process.
            Default depends on runtime (e.g., "java -jar /app/app.jar" for Java).
        imagePullSecrets:
          type: array
          description: Optional Kubernetes imagePullSecrets names used for private registry pulls.
          items:
            type: string
        queueSize:
          type: integer
          minimum: 1
          description: Bounded in-memory queue size
        scalingConfig:
          $ref: '#/components/schemas/ScalingConfig'
        offload:
          $ref: '#/components/schemas/OffloadPolicy'
    FunctionResponse:
      type: object
      required: [name, image, requestedExecutionMode, effectiveExecutionMode]
      properties:
        name:
          type: string
          description: Function name
        image:
          type: string
          description: Container image for the function runtime
        command:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        resources:
          $ref: '#/components/schemas/ResourceSpec'
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 300000
        concurrency:
          type: integer
          minimum: 1
          description: Max concurrent in-flight invocations for this function
        maxRetries:
          type: integer
          minimum: 0
          description: Number of retries for failed invocations
        queueSize:
          type: integer
          minimum: 1
          description: Bounded in-memory queue size
        endpointUrl:
          type: string
          description: Effective HTTP endpoint used for EXTERNAL or provider-backed DEPLOYMENT invocation
        requestedExecutionMode:
          type: string
          enum: [LOCAL, EXTERNAL, DEPLOYMENT]
          description: Execution mode requested at registration time
        effectiveExecutionMode:
          type: string
          enum: [LOCAL, EXTERNAL, DEPLOYMENT]
          description: Effective execution mode after provider selection or degradation
        deploymentBackend:
          type: string
          description: Selected managed deployment backend when `effectiveExecutionMode=DEPLOYMENT`
          example: k8s
        degradationReason:
          type: string
          description: Present when a `DEPLOYMENT` request degrades to a non-managed mode
        runtimeMode:
          type: string
          enum: [HTTP, STDIO, FILE]
        runtimeCommand:
          type: string
        scalingConfig:
          $ref: '#/components/schemas/ScalingConfig'
        imagePullSecrets:
          type: array
          items:
            type: string
        offload:
          $ref: '#/components/schemas/OffloadPolicy'
        deploymentObjects:
          type: object
          additionalProperties:
            type: string
          description: >-
            Names of the objects the deployment backend created for this function — on Kubernetes
            the Deployment, Service and namespace. Absent for non-managed functions.
    OffloadPolicy:
      type: object
      description: >-
        Per-function offload policy. Omit the block to follow the global offload defaults
        (pressure-based offload when the offload module is active).
      properties:
        enabled:
          type: boolean
          description: '`false` opts the function out of offloading entirely'
        targetUrl:
          type: string
          description: Overrides the globally configured remote nanofaas base URL
        mode:
          type: string
          enum: [pressure, always]
          default: pressure
          description: '`always` offloads eagerly; `pressure` offloads only on sync-queue rejection'
    ResourceSpec:
      type: object
      properties:
        requests:
          $ref: '#/components/schemas/ResourceQuantity'
        limits:
          $ref: '#/components/schemas/ResourceQuantity'
      description: >-
        Optional per-function soft requests and hard limits. Kubernetes maps both
        directly; the local container provider maps requests to CPU shares and
        memory reservation, and limits to CPU quota and memory limit.
    ResourceQuantity:
      type: object
      properties:
        cpu:
          type: number
          format: decimal
          minimum: 0.001
          multipleOf: 0.001
          description: CPU cores (for example, 0.25 is one quarter of a core)
        memoryMiB:
          type: integer
          minimum: 1
          description: Memory in mebibytes
    ScalingConfig:
      type: object
      properties:
        strategy:
          type: string
          enum: [INTERNAL, HPA, NONE]
          description: >-
            Who owns the replica count: the internal scaler, an external HPA, or nobody
            (fixed replicas). Concurrency control is independent of this choice.
        minReplicas:
          type: integer
          minimum: 0
        maxReplicas:
          type: integer
          minimum: 1
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ScalingMetric'
        concurrencyControl:
          $ref: '#/components/schemas/ConcurrencyControlConfig'
    ScalingMetric:
      type: object
      properties:
        type:
          type: string
          enum: [queue_depth, in_flight, rps]
          description: Only these three are accepted for the INTERNAL strategy
        target:
          type: string
          description: Target value the scaler drives the metric towards
        query:
          type: string
          description: Optional backend-specific query, used by external strategies
    ConcurrencyControlConfig:
      type: object
      description: >-
        Per-function concurrency governor. Requires the concurrency-control module; without it the
        function keeps its configured `concurrency` unchanged. The resulting limit never exceeds
        `concurrency`, which acts as a ceiling.
      properties:
        mode:
          type: string
          enum: [FIXED, STATIC_PER_POD, ADAPTIVE_PER_POD]
          default: FIXED
          description: >-
            `FIXED` leaves `concurrency` alone; `STATIC_PER_POD` sets it to
            `readyReplicas x targetInFlightPerPod`; `ADAPTIVE_PER_POD` moves the per-replica target
            with observed service time.
        targetInFlightPerPod:
          type: integer
          minimum: 1
          default: 2
          description: In-flight invocations per replica; the starting point in ADAPTIVE_PER_POD
        minTargetInFlightPerPod:
          type: integer
          minimum: 1
          default: 1
        maxTargetInFlightPerPod:
          type: integer
          minimum: 1
          default: 8
        upscaleCooldownMs:
          type: integer
          format: int64
          minimum: 0
          default: 30000
        downscaleCooldownMs:
          type: integer
          format: int64
          minimum: 0
          default: 60000
        highLoadThreshold:
          type: number
          format: double
          default: 0.5
          description: >-
            ADAPTIVE_PER_POD only. Fraction by which the interval's mean service time may exceed the
            function's best observed service time before the per-replica target is lowered.
            0.5 means "back off once latency reaches 2x its best".
        lowLoadThreshold:
          type: number
          format: double
          default: 0.15
          description: >-
            ADAPTIVE_PER_POD only. Below this degradation fraction the per-replica target is raised
            again. 0.15 means "grow while latency stays under ~1.18x its best".
    InvocationRequest:
      type: object
      properties:
        input:
          description: JSON input for the function
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        metadata:
          type: object
          additionalProperties:
            type: string
    InvocationResponse:
      type: object
      required: [executionId, status]
      properties:
        executionId:
          type: string
        status:
          type: string
          enum: [success, error]
        output:
          description: JSON output from the function
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        error:
          $ref: '#/components/schemas/ErrorInfo'
    EnqueueResponse:
      type: object
      required: [executionId, status]
      properties:
        executionId:
          type: string
        status:
          type: string
          enum: [queued]
    ExecutionStatus:
      type: object
      required: [executionId, status]
      properties:
        executionId:
          type: string
        status:
          type: string
          enum: [queued, running, success, error, timeout]
          description: |
            Terminal states are `success`, `error`, and `timeout`.
            Once an execution reaches `timeout`, later completion callbacks do not rewrite it.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        output:
          description: JSON output (present on success)
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        error:
          $ref: '#/components/schemas/ErrorInfo'
    ErrorInfo:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    RuntimeConfigPatchRequest:
      type: object
      properties:
        expectedRevision:
          type: integer
          format: int64
          description: Required for `PATCH`; omitted for `/validate`.
        rateMaxPerSecond:
          type: integer
          minimum: 1
        syncQueueEnabled:
          type: boolean
        syncQueueAdmissionEnabled:
          type: boolean
        syncQueueMaxEstimatedWait:
          type: string
          format: duration
          description: ISO-8601 duration string. Must be positive and must not exceed `syncQueueMaxQueueWait` in the effective configuration.
        syncQueueMaxQueueWait:
          type: string
          format: duration
          description: ISO-8601 duration string. Must be positive and must be greater than or equal to `syncQueueMaxEstimatedWait` in the effective configuration.
        syncQueueRetryAfterSeconds:
          type: integer
          minimum: 1
    RuntimeConfigSnapshot:
      type: object
      required: [revision, rateMaxPerSecond, syncQueueEnabled, syncQueueAdmissionEnabled, syncQueueMaxEstimatedWait, syncQueueMaxQueueWait, syncQueueRetryAfterSeconds]
      properties:
        revision:
          type: integer
          format: int64
        rateMaxPerSecond:
          type: integer
        syncQueueEnabled:
          type: boolean
        syncQueueAdmissionEnabled:
          type: boolean
        syncQueueMaxEstimatedWait:
          type: string
          format: duration
        syncQueueMaxQueueWait:
          type: string
          format: duration
        syncQueueRetryAfterSeconds:
          type: integer
    RuntimeConfigPatchResponse:
      type: object
      required: [revision, effectiveConfig, appliedAt, changeId, warnings]
      properties:
        revision:
          type: integer
          format: int64
        effectiveConfig:
          $ref: '#/components/schemas/RuntimeConfigSnapshot'
        appliedAt:
          type: string
          format: date-time
        changeId:
          type: string
        warnings:
          type: array
          items:
            type: string
    ValidationErrors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: string
    RuntimeConfigParseError:
      type: object
      required: [error, field, value]
      properties:
        error:
          type: string
        field:
          type: string
        value:
          type: string
