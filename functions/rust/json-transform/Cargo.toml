[package]
name = "json-transform"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nanofaas-sdk = { path = "../../../sdks/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Keep the default panic = "unwind": the runtime turns a handler panic into HANDLER_ERROR,
# whereas "abort" would kill the whole process.
[profile.release]
lto = true
codegen-units = 1
strip = true
