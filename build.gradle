plugins {
    id 'java'
    // Declare plugin versions once to avoid Gradle classloader/build-service issues across sibling projects.
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}" apply false
    id 'org.graalvm.buildtools.native' version "${graalvmBuildToolsVersion}" apply false
    id 'com.github.spotbugs' version "${spotbugsGradlePluginVersion}" apply false
    id 'net.ltgt.errorprone' version "${errorProneGradlePluginVersion}" apply false
    id 'org.sonarqube' version "${sonarQubePluginVersion}"
}

def containerdMavenLocal = providers.gradleProperty('containerdMavenLocal')
        .map { it.toBoolean() }
        .getOrElse(false)
def containerdMavenRepository = System.getProperty('maven.repo.local')
if (containerdMavenRepository == null) {
    containerdMavenRepository = new File(System.getProperty('user.home'), '.m2/repository').absolutePath
}

allprojects {
    group = 'it.unimib.datai.nanofaas'
    version = '0.22.0'

    repositories {
        mavenCentral()
        if (containerdMavenLocal) {
            maven {
                url = uri(containerdMavenRepository)
                content {
                    includeGroup 'io.nanofaas'
                    includeGroup 'io.libcni'
                }
            }
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'net.ltgt.errorprone'

    dependencies {
        errorprone "com.google.errorprone:error_prone_core:${errorProneVersion}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.errorprone {
            allErrorsAsWarnings = true
            disableWarningsInGeneratedCode = true
        }
    }

    spotbugs {
        toolVersion = spotbugsVersion
        ignoreFailures = true
        excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
    }

    tasks.matching { it.name == 'spotbugsTest' }.configureEach {
        enabled = false
    }

    tasks.matching { it.name == 'spotbugsMain' }.configureEach {
        reports {
            html.required = true
            xml.required = true
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.findProperty('javaVersion') ?: '21'))
        }
    }

    jacoco {
        toolVersion = '0.8.14'
    }

    // Spring Boot packs collectReachabilityMetadata's output into the bootJar for buildpack native
    // builds, and that task never cleans its directory: the jar carried metadata for every version
    // ever resolved. No native image here is built from a bootJar (bootBuildImage is disabled;
    // nativeCompile reads the metadata repository itself), so leave it out.
    plugins.withId('org.springframework.boot') {
        tasks.named('bootJar') {
            exclude { it.file.path.contains("${File.separator}native-reachability-metadata${File.separator}") }
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    pluginManager.withPlugin('org.graalvm.buildtools.native') {
        project.extensions.configure('graalvmNative') { nativeExtension ->
            nativeExtension.binaries.configureEach { binary ->
                // -O3 optimises for speed and -Os for binary size; the levels choose what
                // to spend rather than how much to optimise. Measured on an isolated bench
                // with memory to spare, 3 against s gave 9,251 requests per second against
                // 8,398 (+10%), started in 0.068s against 0.173s and held 39 MiB at rest
                // against 121 MiB. The image doubles, 195MB to 397MB, because -O3 inlines:
                // the code area triples from FEWER compilation units, each carrying copies
                // of what it absorbed. That cost lands on the registry, not the node — with
                // a heap ceiling in place both builds peaked at the same 744 MiB, since the
                // code is mapped from the file rather than copied into the heap.
                //
                // The gain is conditional and worth stating: under a 1GB limit the two were
                // identical at ~3,490 requests per second, because there the bottleneck is
                // collection rather than code quality.
                binary.buildArgs.add("-O${project.findProperty('nativeOptimization') ?: '3'}")
                // -PnativeGc=G1 needs Oracle GraalVM on Linux; Community offers only
                // 'serial' and 'epsilon', and rejects anything else at build time.
                // Measured motivation: the serial collector spent 32% of wall-clock
                // time collecting under sustained load, with pauses reaching 1.9s.
                if (project.hasProperty('nativeGc')) {
                    binary.buildArgs.add("--gc=${project.property('nativeGc')}")
                }
                // G1 has no usable GC MXBeans, so JFR is mandatory for its observability.
                def nativeMonitoring = (project.findProperty('nativeMonitoring') ?: '')
                        .split(',')
                        .findAll { !it.isBlank() }
                if (project.findProperty('nativeGc') == 'G1' && !nativeMonitoring.contains('jfr')) {
                    nativeMonitoring += 'jfr'
                }
                if (!nativeMonitoring.isEmpty()) {
                    binary.buildArgs.add("--enable-monitoring=${nativeMonitoring.join(',')}")
                }
                // -PnativeBuildMemory=6g bounds the BUILDER's heap, not the built
                // image's. native-image sizes its own heap from the memory it can
                // see, which is the whole machine even when most of it is already
                // spoken for: on a 12GB VM also running k3s, a control plane and
                // Prometheus, it was SIGKILLed by the OOM killer after 9m50s of
                // work. A build that dies that way wastes the ten minutes and says
                // "exit 137"; one that is told its budget either fits or fails fast.
                if (project.hasProperty('nativeBuildMemory')) {
                    binary.buildArgs.add("-J-Xmx${project.property('nativeBuildMemory')}")
                }
                // Fewer workers cost wall-clock and save peak memory, which is the
                // right trade on a machine where the build is competing with the
                // workload it will later be measured against.
                if (project.hasProperty('nativeParallelism')) {
                    binary.buildArgs.add("--parallelism=${project.property('nativeParallelism')}")
                }
            }
        }
    }

    configurations.all {
        // HTTP/3/QUIC support that reactor-netty pulls in automatically; nothing in this
        // codebase enables HTTP/3. Drops netty-codec-http3 plus its 5 platform-native quic jars.
        exclude group: 'io.netty', module: 'netty-codec-http3'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
            csv.required = false
        }
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                limit {
                    minimum = 0.85
                }
            }
        }
    }
}

tasks.register('verifyHelmVersionSync') {
    group = 'verification'
    description = 'Verify Helm chart/image versions are aligned with the Gradle project version.'
    doLast {
        def expectedVersion = version.toString()
        def expectedTag = "v${expectedVersion}"
        def chartFile = file('deploy/helm/nanofaas/Chart.yaml')
        def valuesFile = file('deploy/helm/nanofaas/values.yaml')

        if (!chartFile.exists() || !valuesFile.exists()) {
            throw new GradleException("Helm chart files not found under deploy/helm/nanofaas")
        }

        def chart = chartFile.text
        def values = valuesFile.text
        def errors = []

        if (!(chart =~ /(?m)^version:\s*${java.util.regex.Pattern.quote(expectedVersion)}\s*$/)) {
            errors << "deploy/helm/nanofaas/Chart.yaml version is not ${expectedVersion}"
        }
        if (!(chart =~ /(?m)^appVersion:\s*\"${java.util.regex.Pattern.quote(expectedVersion)}\"\s*$/)) {
            errors << "deploy/helm/nanofaas/Chart.yaml appVersion is not ${expectedVersion}"
        }
        if (!(values =~ /(?m)^\s*tag:\s*${java.util.regex.Pattern.quote(expectedTag)}\s*$/)) {
            errors << "deploy/helm/nanofaas/values.yaml controlPlane.image.tag is not ${expectedTag}"
        }

        def imageTagMatcher = (values =~ /ghcr\.io\/miciav\/nanofaas\/[a-z0-9-]+:(v[0-9]+\.[0-9]+\.[0-9]+)/)
        imageTagMatcher.each { match ->
            if (match[1] != expectedTag) {
                errors << "deploy/helm/nanofaas/values.yaml image tag mismatch: found ${match[1]}, expected ${expectedTag}"
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Helm/Gradle version mismatch:\n - " + errors.unique().join("\n - "))
        }
    }
}

tasks.named('build') {
    dependsOn 'verifyHelmVersionSync'
}
