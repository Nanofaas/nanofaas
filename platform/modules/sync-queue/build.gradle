plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

// async-queue is defaultEnabled, so it lands on this module's test classpath and
// both providers then publish a FunctionCapacityRegistry - an ambiguity the module
// selector forbids (conflicts=async-queue) but a Gradle classpath does not know
// about. The context test is gated on the selection for that reason.
def syncQueueSelected = gradle.ext.nanofaasSelectedControlPlaneModules.contains('sync-queue')

dependencies {
    // P21: contract library only; the core implementation stays on the test classpath.
    implementation project(':common')
    implementation project(':control-plane-spi')
    implementation project(':workload-metrics')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    // The runtime-config implementation supplies the concrete registry these tests drive;
    // the core implementation backs the module's integration tests.
    testImplementation project(':control-plane')
    testImplementation project(':control-plane-modules:runtime-config')
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testImplementation 'io.micrometer:micrometer-registry-prometheus'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    systemProperty 'nanofaas.queue.provider', syncQueueSelected ? 'sync-queue' : 'async-queue'
}

// Vedi il gemello in platform/control-plane/build.gradle: classpath per i banchi
// di misura fuori da Gradle (docs/experiments/*/run.sh).
tasks.register('printTestClasspath') {
    doLast {
        println sourceSets.test.runtimeClasspath.asPath
    }
}
