plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    implementation project(':common')
    implementation project(':control-plane-spi')
    implementation project(':workload-metrics')
    // Task 8 (issue #208): EngineSyncQueueGateway composes this module's own admission
    // collaborators (WaitEstimator, SyncQueueAdmissionController) onto the shared engine, so
    // this module now depends on control-plane and execution-runtime directly instead of only
    // on their test classpath. async-queue and sync-queue now share one classpath by design —
    // the ambiguity this comment used to warn about (two schedulers, two WorkloadCapacityController
    // beans) is exactly what SchedulerConfiguration's single-bean composition removes.
    implementation project(':control-plane')
    implementation project(':execution-runtime')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation project(':control-plane-modules:runtime-config')
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testImplementation 'io.micrometer:micrometer-registry-prometheus'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Vedi il gemello in platform/control-plane/build.gradle: classpath per i banchi
// di misura fuori da Gradle (docs/experiments/*/run.sh).
tasks.register('printTestClasspath') {
    doLast {
        println sourceSets.test.runtimeClasspath.asPath
    }
}
