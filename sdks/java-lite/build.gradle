plugins {
    id 'java-library'
    id 'org.graalvm.buildtools.native'
}

dependencies {
    api project(':common')
    api 'com.fasterxml.jackson.core:jackson-databind:2.22.3'

    api 'io.prometheus:prometheus-metrics-core:1.9.0'
    api 'io.prometheus:prometheus-metrics-exposition-formats:1.9.0'

    api 'org.slf4j:slf4j-api:2.0.20'
    implementation 'ch.qos.logback:logback-classic:1.6.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    inputs.files(rootProject.files('sdks/runtime-contract/saturation-wire-corpus.json',
            'sdks/runtime-contract/failure-wire-corpus.json',
            'sdks/runtime-contract/validate_saturation_wire_corpus.py'))
            .withPropertyName('sharedRuntimeContracts')
}

graalvmNative {
    binaries {
        main {
            imageName = 'nanofaas-lite-runtime'
        }
    }
    metadataRepository {
        enabled = true
    }
}
