plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    // Compile-only: RawJson writes itself through Jackson 3. Not a runtime dependency, and not
    // exported: only the control plane - which always has Jackson 3 - ever loads that class. The
    // SDKs and the CLI that share this module do not (the CLI is on Jackson 2). A module that
    // calls RawJson's own methods needs the same compile-only line to see its supertype.
    compileOnly 'tools.jackson.core:jackson-databind'
    api 'jakarta.validation:jakarta.validation-api:3.1.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'tools.jackson.core:jackson-databind'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
