plugins {
    id 'application'
    id 'org.graalvm.buildtools.native'
}

dependencies {
    implementation project(':common')

    implementation 'info.picocli:picocli:4.7.7'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'it.unimib.datai.nanofaas.cli.NanofaasCli'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('nanofaas-cli.properties') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    // Generate GraalVM reflection config for picocli command classes.
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}

tasks.withType(Tar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Zip).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

graalvmNative {
    binaries {
        main {
            imageName = 'nanofaas-cli'
        }
    }
}

tasks.register('nativeSmoke', Exec) {
    dependsOn tasks.named('nativeCompile')
    commandLine 'python3', rootProject.file('scripts/native-cli-smoke.py').absolutePath,
            layout.buildDirectory.file('native/nativeCompile/nanofaas-cli').get().asFile.absolutePath
}
