apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanofaas-control-plane
  namespace: nanofaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nanofaas-control-plane
  template:
    metadata:
      labels:
        app: nanofaas-control-plane
    spec:
      serviceAccountName: nanofaas-control-plane
      containers:
        - name: control-plane
          image: ghcr.io/miciav/nanofaas/control-plane:v0.22.0
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Function pods call back here; application.yml's default names the
            # `default` namespace, which this manifest does not deploy into.
            - name: NANOFAAS_K8S_CALLBACKURL
              value: http://control-plane.nanofaas.svc.cluster.local:8080/v1/internal/executions
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
