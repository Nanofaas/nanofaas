plugins {
    id 'java-gradle-plugin'
}

group = 'it.unimib.datai.nanofaas'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Versions of the plugins warm-echo applies, from the main build's gradle.properties.
def mainBuildProperties = new Properties()
file('../../gradle.properties').withInputStream { mainBuildProperties.load(it) }

configurations {
    testPluginClasspath
}

dependencies {
    implementation 'org.yaml:snakeyaml:2.7'
    implementation 'com.networknt:json-schema-validator:2.0.7'
    testImplementation gradleTestKit()
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
    testPluginClasspath "org.springframework.boot:spring-boot-gradle-plugin:${mainBuildProperties.springBootVersion}"
    testPluginClasspath "io.spring.gradle:dependency-management-plugin:${mainBuildProperties.springDependencyManagementVersion}"
    testPluginClasspath "org.graalvm.buildtools:native-gradle-plugin:${mainBuildProperties.graalvmBuildToolsVersion}"
}

// TestKit's withPluginClasspath() then resolves these by id, so a fixture can apply the real plugins offline.
tasks.named('pluginUnderTestMetadata') {
    pluginClasspath.from(configurations.testPluginClasspath)
}

gradlePlugin {
    plugins {
        controlPlaneModules {
            id = 'it.unimib.datai.nanofaas.control-plane-modules'
            implementationClass = 'it.unimib.datai.nanofaas.gradle.ControlPlaneModulesPlugin'
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    def warmEchoScript = file('../../services/java/warm-echo/build.gradle')
    inputs.file(warmEchoScript)
    inputs.file(file('../../gradle/jvm-jar-without-aot.gradle'))
    systemProperty 'nanofaas.warmEchoBuildScript', warmEchoScript.absolutePath
}
