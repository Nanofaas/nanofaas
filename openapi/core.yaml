openapi: 3.0.3
info:
  title: nanofaas Control Plane API
  version: 0.21.0
  description: |
    Minimal FaaS control plane API for function registration and invocation.
servers:
  - url: /

paths:
  /v1/functions:
    get:
      summary: List functions
      operationId: listFunctions
      responses:
        '200':
          description: Function list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FunctionResponse'
    post:
      summary: Register a function
      operationId: registerFunction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionSpec'
      responses:
        '201':
          description: Function registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
        '422':
          description: Image not found in registry
        '424':
          description: Image pull authentication required (configure imagePullSecrets)
        '503':
          description: Registry unavailable during image validation
        '409':
          description: Function already exists
  /v1/functions/{name}:
    get:
      summary: Get a function
      operationId: getFunction
      parameters:
        - $ref: '#/components/parameters/FunctionName'
      responses:
        '200':
          description: Function details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
        '404':
          description: Not found
    patch:
      summary: Update the mutable settings of a function
      operationId: updateFunction
      description: |
        Applies a partial update without re-registering the function and without touching its
        deployment: the function keeps serving throughout. Only control-plane knobs are mutable;
        any other property is rejected with 400 rather than silently ignored.
      parameters:
        - $ref: '#/components/parameters/FunctionName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunctionUpdateRequest'
      responses:
        '200':
          description: Updated function
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionResponse'
        '400':
          description: Invalid value, or an attempt to change an immutable field
        '404':
          description: Function not found
    delete:
      summary: Delete a function
      operationId: deleteFunction
      description: |
        Removes the function and the deployment behind it.

        If the deployment backend cannot delete every resource it owns, the function enters
        **pending removal** instead of being reported as deleted or as restored: the entry stays in
        the catalog so the leftover resources remain traceable, it admits no invocation and accepts
        no change (409 `FUNCTION_REMOVAL_PENDING` on invoke, enqueue, patch, replicas and
        re-registration), and repeating this DELETE resumes the cleanup idempotently. The 409 body
        names the resources the backend still owns.
      parameters:
        - $ref: '#/components/parameters/FunctionName'
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
        '409':
          description: |
            The deletion removed only part of the deployment. The function is in pending removal
            until a retried DELETE succeeds; the body carries `FUNCTION_REMOVAL_PENDING` and the
            resources still owned by the backend.

  /v1/functions/{name}/replicas:
    get:
      summary: Get the managed replica status of a function
      operationId: getFunctionReplicaStatus
      parameters:
        - $ref: '#/components/parameters/FunctionName'
      responses:
        '200':
          description: Desired and ready replicas reported by the deployment backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicaStatusResponse'
        '400':
          description: The function does not use a managed deployment backend
        '404':
          description: Function not found
        '503':
          description: The deployment backend could not report replica status
    put:
      summary: Set the desired replica count of a function
      operationId: setFunctionReplicas
      parameters:
        - $ref: '#/components/parameters/FunctionName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplicaRequest'
      responses:
        '200':
          description: Desired replica count accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplicaResponse'
        '400':
          description: Invalid replica count or unmanaged function
        '404':
          description: Function not found
        '503':
          description: The deployment backend could not set the replica count

  /v1/functions/{name}:invoke:
    post:
      summary: Invoke a function synchronously
      operationId: invokeFunctionSync
      parameters:
        - $ref: '#/components/parameters/FunctionName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TimeoutMs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationRequest'
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: |
            Function result. The body is always the `InvocationResponse` envelope,
            never raw handler output. When the handler decides its own HTTP status,
            that status replaces this 200 — signalled by the
            `X-NanoFaaS-Function-Status` response header — while the body remains
            `InvocationResponse` JSON.
          headers:
            X-Execution-Id:
              schema:
                type: string
            X-NanoFaaS-Function-Status:
              description: |
                Marker (value `true`) that the HTTP status is function-decided
                rather than control-plane-decided. A marked non-2xx status is still
                a completed invocation, not a platform error.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Function not registered
        '408':
          description: |
            The caller's wait budget expired; only this caller's wait concluded. The
            shared execution keeps running, and a later poll of
            `GET /v1/executions/{executionId}` (or a replay of the same
            `Idempotency-Key`) may first observe in-flight work (`queued`/`running`)
            and then the real result — never a fabricated `timeout` borrowed from
            another caller's budget. This also applies to offloaded work: the remote
            invocation uses the function's timeout, independently of this waiter's budget.
        '409':
          description: |
            The function is in pending removal: a previous DELETE deprovisioned it only partially
            and its deployment backend still owns resources. No new invocation is admitted under
            that generation until a retried DELETE finishes the cleanup. Body carries
            `FUNCTION_REMOVAL_PENDING`.
        '410':
          description: |
            The invocation already completed under this `Idempotency-Key`, but its
            outcome payload was evicted for capacity before the retention window
            ended. The function was NOT re-invoked: the deduplication guarantee
            holds, only the stored result is gone. The `X-Execution-Id` header names
            the completed execution.
        '413':
          description: |
            Invocation request body exceeded the active ingress byte limit. The limit
            is enforced before complete JSON aggregation and before idempotency replay;
            bodies without Content-Length are counted and rejected as received bytes
            cross the same boundary.
        '429':
          description: Too many requests. Returned for rate limiting, queue/admission backpressure, and an exhausted idempotency-key budget on the synchronous invoke path.
        '500':
          description: Invocation failed

  /v1/functions/{name}:enqueue:
    post:
      summary: Enqueue a function invocation asynchronously
      operationId: invokeFunctionAsync
      parameters:
        - $ref: '#/components/parameters/FunctionName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationRequest'
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '404':
          description: Function not registered
        '409':
          description: |
            The function is in pending removal: a previous DELETE deprovisioned it only partially
            and its deployment backend still owns resources. No new invocation is admitted under
            that generation until a retried DELETE finishes the cleanup. Body carries
            `FUNCTION_REMOVAL_PENDING`.
        '410':
          description: |
            The invocation already completed under this `Idempotency-Key`, but its
            outcome payload was evicted for capacity before the retention window
            ended. The function was NOT re-invoked; the `X-Execution-Id` header names
            the completed execution.
        '413':
          description: |
            Invocation request body exceeded the active ingress byte limit. The limit
            is enforced before complete JSON aggregation and before idempotency replay;
            bodies without Content-Length are counted and rejected as received bytes
            cross the same boundary.
        '429':
          description: Too many requests. Returned for queue/admission backpressure and an exhausted idempotency-key budget on the asynchronous enqueue path.
        '501':
          description: The async-queue module is not part of this build, so the asynchronous path is unavailable.

  /v1/executions/{executionId}:
    get:
      summary: Get execution status/result
      operationId: getExecution
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: |
            Execution status. Terminal values (`success`, `error`, `timeout`) are stable
            and are not rewritten by late callbacks. A caller's wait timeout does NOT make
            the execution terminal: a later poll may first observe in-flight work
            (`queued`/`running`) and then the real result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionStatus'
        '404':
          description: Not found

components:
  parameters:
    FunctionName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z][a-zA-Z0-9._-]{0,62}$'
      description: Function name
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: |
        Client-provided key to deduplicate requests. A key stays bound to its
        execution for the execution's whole life and for
        `nanofaas.execution-store.ttl` after it completes. A replay within that
        window returns the stored outcome — or `410 Gone` if the outcome payload
        was evicted for capacity — instead of re-invoking the function. After the
        window elapses the same key may start a new execution.
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
      description: Trace identifier propagated to function pods.
    TimeoutMs:
      name: X-Timeout-Ms
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 300000
      description: Max time in milliseconds for sync invocation.

  schemas:
    ReplicaRequest:
      type: object
      required: [replicas]
      properties:
        replicas:
          type: integer
          minimum: 0
    ReplicaResponse:
      type: object
      required: [function, replicas]
      properties:
        function:
          type: string
        replicas:
          type: integer
          minimum: 0
    ReplicaStatusResponse:
      type: object
      required: [name, desiredReplicas, readyReplicas]
      properties:
        name:
          type: string
        desiredReplicas:
          type: integer
          minimum: 0
        readyReplicas:
          type: integer
          minimum: 0
    FunctionSpec:
      type: object
      required: [name, image]
      properties:
        name:
          type: string
          description: Function name
        image:
          type: string
          description: Container image for the function runtime
        command:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        resources:
          $ref: '#/components/schemas/ResourceSpec'
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 300000
        concurrency:
          type: integer
          minimum: 1
          description: Max concurrent in-flight invocations for this function
        maxRetries:
          type: integer
          minimum: 0
          default: 3
          description: Number of retries for failed invocations (default 3)
        endpointUrl:
          type: string
          description: HTTP endpoint of the function, required for EXTERNAL execution mode
        executionMode:
          type: string
          enum: [LOCAL, EXTERNAL, DEPLOYMENT]
          description: Execution mode for the function (DEPLOYMENT is default)
        runtimeMode:
          type: string
          enum: [HTTP, STDIO, FILE]
          description: |
            How the watchdog interacts with the function process:
            Omit to preserve the image's own watchdog default.
            - HTTP: Function exposes HTTP server (Java Spring, Python FastAPI)
            - STDIO: Function reads stdin JSON, writes stdout JSON (scripts)
            - FILE: Function reads input file, writes output file (Bash, binaries)
        runtimeCommand:
          type: string
          description: |
            Custom command to run the function process.
            Default depends on runtime (e.g., "java -jar /app/app.jar" for Java).
        imagePullSecrets:
          type: array
          description: Optional Kubernetes imagePullSecrets names used for private registry pulls.
          items:
            type: string
        queueSize:
          type: integer
          minimum: 1
          description: Bounded in-memory queue size
        scalingConfig:
          $ref: '#/components/schemas/ScalingConfig'
        offload:
          $ref: '#/components/schemas/OffloadPolicy'
    FunctionUpdateRequest:
      type: object
      additionalProperties: false
      description: |
        Partial update of a registered function. A field left out keeps its current value.
        `queueSize` is not mutable: the queue is sized when the function is first registered.
      properties:
        concurrency:
          type: integer
          minimum: 1
          description: New ceiling for concurrent in-flight invocations. The concurrency governor can throttle below this value but never above it.
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 300000
        maxRetries:
          type: integer
          minimum: 0
        concurrencyControl:
          allOf:
            - $ref: '#/components/schemas/ConcurrencyControlConfig'
          description: Replaces the whole block; it is not merged field by field.
    FunctionResponse:
      type: object
      required: [name, image, requestedExecutionMode, effectiveExecutionMode]
      properties:
        name:
          type: string
          description: Function name
        image:
          type: string
          description: Container image for the function runtime
        command:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        resources:
          $ref: '#/components/schemas/ResourceSpec'
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 300000
        concurrency:
          type: integer
          minimum: 1
          description: Max concurrent in-flight invocations for this function
        maxRetries:
          type: integer
          minimum: 0
          description: Number of retries for failed invocations
        queueSize:
          type: integer
          minimum: 1
          description: Bounded in-memory queue size
        endpointUrl:
          type: string
          description: Effective HTTP endpoint used for EXTERNAL or provider-backed DEPLOYMENT invocation
        requestedExecutionMode:
          type: string
          enum: [LOCAL, EXTERNAL, DEPLOYMENT]
          description: Execution mode requested at registration time
        effectiveExecutionMode:
          type: string
          enum: [LOCAL, EXTERNAL, DEPLOYMENT]
          description: Effective execution mode after provider selection or degradation
        deploymentBackend:
          type: string
          description: Selected managed deployment backend when `effectiveExecutionMode=DEPLOYMENT`
          example: k8s
        degradationReason:
          type: string
          description: Present when a `DEPLOYMENT` request degrades to a non-managed mode
        runtimeMode:
          type: string
          enum: [HTTP, STDIO, FILE]
        runtimeCommand:
          type: string
        scalingConfig:
          $ref: '#/components/schemas/ScalingConfig'
        imagePullSecrets:
          type: array
          items:
            type: string
        offload:
          $ref: '#/components/schemas/OffloadPolicy'
        deploymentObjects:
          type: object
          additionalProperties:
            type: string
          description: >-
            Names of the objects the deployment backend created for this function — on Kubernetes
            the Deployment, Service and namespace. Absent for non-managed functions.
    OffloadPolicy:
      type: object
      description: >-
        Per-function offload policy. Omit the block to follow the global offload defaults
        (pressure-based offload when the offload module is active).
      properties:
        enabled:
          type: boolean
          description: '`false` opts the function out of offloading entirely'
        targetUrl:
          type: string
          description: Overrides the globally configured remote nanofaas base URL
        mode:
          type: string
          enum: [pressure, always]
          default: pressure
          description: '`always` offloads eagerly; `pressure` offloads only on sync-queue rejection'
    ResourceSpec:
      type: object
      properties:
        requests:
          $ref: '#/components/schemas/ResourceQuantity'
        limits:
          $ref: '#/components/schemas/ResourceQuantity'
      description: >-
        Optional per-function soft requests and hard limits. Kubernetes maps both
        directly; the local container provider maps requests to CPU shares and
        memory reservation, and limits to CPU quota and memory limit.
    ResourceQuantity:
      type: object
      properties:
        cpu:
          type: number
          format: decimal
          minimum: 0.001
          multipleOf: 0.001
          description: CPU cores (for example, 0.25 is one quarter of a core)
        memoryMiB:
          type: integer
          minimum: 1
          description: Memory in mebibytes
    ScalingConfig:
      type: object
      properties:
        strategy:
          type: string
          enum: [INTERNAL, HPA, NONE]
          description: >-
            Who owns the replica count: the internal scaler, an external HPA, or nobody
            (fixed replicas). Concurrency control is independent of this choice.
        minReplicas:
          type: integer
          minimum: 0
        maxReplicas:
          type: integer
          minimum: 1
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ScalingMetric'
        concurrencyControl:
          $ref: '#/components/schemas/ConcurrencyControlConfig'
    ScalingMetric:
      type: object
      properties:
        type:
          type: string
          enum: [queue_depth, in_flight, rps]
          description: Only these three are accepted for the INTERNAL strategy
        target:
          type: string
          description: Target value the scaler drives the metric towards
        query:
          type: string
          description: Optional backend-specific query, used by external strategies
    ConcurrencyControlConfig:
      type: object
      description: >-
        Per-function concurrency governor. Requires the concurrency-control module; without it the
        function keeps its configured `concurrency` unchanged. The resulting limit never exceeds
        `concurrency`, which acts as a ceiling.
      properties:
        mode:
          type: string
          enum: [FIXED, STATIC_PER_POD, ADAPTIVE_PER_POD, BUDGETED, SOJOURN]
          default: FIXED
          description: >-
            `FIXED` leaves `concurrency` alone; `STATIC_PER_POD` sets it to
            `readyReplicas x targetInFlightPerPod`; `ADAPTIVE_PER_POD` moves the per-replica target
            with observed service time; `BUDGETED` sizes the limit to meet `targetLatencyMs` and
            takes it from a concurrency budget shared with every other BUDGETED function, so the
            limits cannot add up to more than the platform has; `SOJOURN` searches for the limit
            that minimises the time a caller spends in the system, queue wait included, which is
            the quantity the other modes leave out.
        targetInFlightPerPod:
          type: integer
          minimum: 1
          default: 2
          description: In-flight invocations per replica; the starting point in ADAPTIVE_PER_POD
        minTargetInFlightPerPod:
          type: integer
          minimum: 1
          default: 1
        maxTargetInFlightPerPod:
          type: integer
          minimum: 1
          default: 8
        upscaleCooldownMs:
          type: integer
          format: int64
          minimum: 0
          default: 30000
        downscaleCooldownMs:
          type: integer
          format: int64
          minimum: 0
          default: 60000
        highLoadThreshold:
          type: number
          format: double
          default: 0.5
          description: >-
            ADAPTIVE_PER_POD only. Fraction by which the interval's mean service time may exceed the
            function's best observed service time before the per-replica target is lowered.
            0.5 means "back off once latency reaches 2x its best".
        lowLoadThreshold:
          type: number
          format: double
          default: 0.15
          description: >-
            ADAPTIVE_PER_POD only. Below this degradation fraction the per-replica target is raised
            again. 0.15 means "grow while latency stays under ~1.18x its best".
        targetLatencyMs:
          type: integer
          format: int64
          minimum: 1
          default: 250
          description: >-
            BUDGETED and SOJOURN. An absolute target an operator can take from a service
            agreement, rather than a ratio against the function's own past behaviour as the
            ADAPTIVE_PER_POD thresholds are. It means different things to the two modes:
            BUDGETED holds the function to it as a SERVICE-TIME SLO and sizes the limit to meet it,
            while for SOJOURN it is an END-TO-END promise, queue wait included, and the limit is
            left alone while the function is inside it.
        weight:
          type: number
          format: double
          minimum: 0
          default: 1
          description: >-
            BUDGETED only. This function's claim on the shared budget when it cannot satisfy every
            function at once. Only relative values matter, and equal weights mean an equal split.
    InvocationRequest:
      type: object
      properties:
        input:
          description: JSON input for the function
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        metadata:
          type: object
          additionalProperties:
            type: string
    InvocationResponse:
      type: object
      required: [executionId, status]
      properties:
        executionId:
          type: string
        status:
          type: string
          enum: [success, error]
        output:
          description: JSON output from the function
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        error:
          $ref: '#/components/schemas/ErrorInfo'
    ExecutionStatus:
      type: object
      required: [executionId, status]
      properties:
        executionId:
          type: string
        status:
          type: string
          enum: [queued, running, success, error, timeout]
          description: |
            Terminal states are `success`, `error`, and `timeout`.
            `timeout` records an execution-level deadline (for example a queue-wait
            expiry), never a single caller's wait budget. A caller whose own wait budget
            expired may later poll this endpoint and observe in-flight work
            (`queued`/`running`) and then the real result.
        startedAt:
          type: string
          format: date-time
          description: |
            When the invocation was ADMITTED, not when a runtime first ran it. It is set as
            soon as the execution exists, so a `queued` execution already reports it, and it
            does not move when an internal retry starts a new attempt — the invocation began
            once. Use `finishedAt - startedAt` for what the caller experienced end to end.
        finishedAt:
          type: string
          format: date-time
          description: When the invocation reached a terminal state. Absent until then.
        output:
          description: |
            JSON output. Present on success for asynchronous and idempotency-keyed
            executions, whose caller has only the execution id and for whom this is
            the only way to the result.

            Null for a plain synchronous execution: its output was already returned
            in the body of the `:invoke` response, on the connection the caller was
            holding, and a second copy is not retained.
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        error:
          $ref: '#/components/schemas/ErrorInfo'
        coldStart:
          type: boolean
          description: Whether this execution paid a runtime cold start.
        initDurationMs:
          type: integer
          format: int64
          description: Runtime initialisation time, present only on a cold start.
        statusCode:
          type: integer
          description: HTTP status the handler chose for its response.
        headers:
          type: object
          additionalProperties:
            type: string
          description: |
            Response headers the handler set. Retained under the same rule as
            `output`, and null for a plain synchronous execution.
        encoding:
          type: string
          description: |
            Encoding of `output`. Retained under the same rule as `output`.
    ErrorInfo:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
