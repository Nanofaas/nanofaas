plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.graalvm.buildtools.native'
}

def selectedOptionalControlPlaneModuleNames = gradle.ext.nanofaasSelectedControlPlaneModules
def selectedOptionalControlPlaneModuleProjects = rootProject.subprojects
        .findAll { selectedOptionalControlPlaneModuleNames.contains(it.name) }

if (selectedOptionalControlPlaneModuleNames.contains('containerd-deployment-provider')) {
    dependencyManagement {
        dependencies {
            dependency 'com.google.protobuf:protobuf-java:4.36.2'
            dependency 'com.google.protobuf:protobuf-java-util:4.36.2'
        }
    }
}

dependencies {
    implementation project(':common')
    implementation project(':control-plane-spi')
    implementation project(':forecasting-api')
    // api, not implementation (Task 10 step 4, issue #208): control-plane's own PUBLIC types
    // (ExecutionCompletionHandler, InvocationExecutionFactory, ...) reference ExecutionRecord,
    // ExecutionStore and friends directly, so execution-runtime is part of this module's ABI.
    // A downstream test-only consumer (testImplementation project(':control-plane'), as
    // :offload and :concurrency-control do) needs these on its own compile classpath; the same
    // shape as the Caffeine/Micrometer fix already applied in execution-runtime's own build.gradle.
    api project(':execution-runtime')
    implementation project(':workload-metrics')
    implementation 'com.github.ben-manes.caffeine:caffeine'
    selectedOptionalControlPlaneModuleProjects.each { moduleProject ->
        runtimeOnly project(moduleProject.path)
    }
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // reactor-netty ships only the linux-x86_64 epoll library; without this, aarch64 hosts
    // silently fall back to NIO.
    runtimeOnly 'io.netty:netty-transport-native-epoll::linux-aarch_64'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testImplementation 'org.springframework.boot:spring-boot-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-webtestclient'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.awaitility:awaitility:4.3.0'
}

tasks.register('printSelectedControlPlaneModules') {
    group = 'help'
    description = 'Print the control-plane modules included in this build.'
    doLast {
        def names = selectedOptionalControlPlaneModuleNames
        if (names.isEmpty()) {
            println 'No optional control-plane modules selected.'
        } else {
            println "Selected control-plane modules: ${names.join(', ')}"
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // IssueCoverageTest reads these repo files directly; OpenApiRouteCoverageTest reads the
    // composed contract from the test classpath instead. Without declaring these inputs the
    // task stays UP-TO-DATE when only the spec or a doc changes, and never notices the drift.
    inputs.files(
            rootProject.file('openapi/core.yaml'),
            rootProject.fileTree('platform/modules') { include '*/openapi.yaml' },
            rootProject.file('docs/slo.md'),
            rootProject.file('docs/quickstart.md'),
            rootProject.file('docs/example-function.md')
    ).withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty 'project.version', project.version.toString()
    systemProperty 'nanofaas.selectedControlPlaneModules', selectedOptionalControlPlaneModuleProjects.collect { it.name }.sort().join(',')
    dependsOn 'bootJar'
    dependsOn ':services:java:warm-echo:bootJar'
    dependsOn ':functions:java:word-stats:bootJar'
    dependsOn ':functions:java:json-transform:bootJar'
    dependsOn ':functions:java:roman-numeral:bootJar'
    dependsOn ':functions:java:figlet:bootJar'
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
    // Nothing runs -Djarmode=tools: the Dockerfile unpacks the jar with `jar xf`.
    includeTools = false
    // Kept on the runtime classpath (tests, bootRun, native), dropped from the Linux image:
    // JMS/Mail metrics with no JMS or Mail here, the macOS DNS resolver, and caffeine's
    // compile-time annotations.
    classpath = classpath.filter { jar ->
        !(jar.name.startsWith('micrometer-jakarta9-')
                || (jar.name.startsWith('netty-resolver-dns-') && jar.name.contains('macos'))
                || jar.name.startsWith('error_prone_annotations-'))
    }
}

tasks.named('jar') {
    // Keep a plain JAR consumable so optional modules can compile against control-plane types.
    enabled = true
}

graalvmNative {
    binaries {
        main {
            // Kubernetes-oriented optional modules may still rely on SnakeYAML charsets.
            buildArgs.add('-H:+AddAllCharsets')
            // An executable, explicitly. This module applies `java-library` (Task 10 step 4,
            // d456915f, so `api project(':execution-runtime')` exists alongside the Boot plugin),
            // and native-build-tools 1.1.6's NativeImagePlugin.configureJavaProject registers
            // plugins.withId("java-library") -> options.getSharedLibrary().convention(true) --
            // a shared library, where the otherwise-identical plain `java` project gets the false
            // default. :control-plane applies no `application` plugin either, so no main class is
            // derived and the `main` binary silently became control-plane.so: `nativeCompile`
            // went green while producing nothing runnable, which is also what
            // scripts/native-java-image.sh copies as its /app/application. Set it back to false
            // here rather than by dropping `java-library`, which the module needs for its ABI.
            // Verified by artifact, not by the build's exit code:
            //   file platform/control-plane/build/native/nativeCompile/control-plane
            // must say "ELF ... pie executable", never "shared object".
            sharedLibrary.set(false)
        }
    }
}

// Enable Spring AOT processing only for native-oriented builds. The settings plugin resolves
// this once so the build-metadata module records the same answer it gates AOT on.
def nativeBuildRequested = gradle.ext.nanofaasNativeBuildRequested

if (!nativeBuildRequested) {
    // Main AOT - not needed for regular builds
    tasks.named('processAot') { enabled = false }
    tasks.named('compileAotJava') { enabled = false }
    tasks.named('processAotResources') { enabled = false }
    tasks.named('aotClasses') { enabled = false }
    // Disabled tasks keep their previous outputs, and bootJar still packages the aot source set:
    // without this filter a JVM jar built after a native build carries stale AOT classes.
    tasks.named('bootJar') {
        // processAot writes the generated classes (CGLIB proxies) to its own classesOutput, which is on the
        // bootJar classpath but not part of sourceSets.aot.output.
        def aotOutputs = files(sourceSets.aot.output, tasks.named('processAot').flatMap { it.classesOutput })
        classpath = classpath.filter { !aotOutputs.files.contains(it) }
    }
    apply from: rootProject.file('gradle/jvm-jar-without-aot.gradle')
}
// A native build decides its property-conditional beans (runtime-config's admin API, the soak metrics, the image
// validator) during Spring AOT. Hand AOT the configuration the runtime will read (a recipe's controlPlane.config),
// or it decides with application.yml's defaults. file:, not optional:file:, so a wrong path fails the build.
def aotConfig = findProperty('nanofaasAotConfig')
if (nativeBuildRequested && aotConfig != null) {
    if (aotConfig.toString().isBlank()) {
        throw new GradleException('-PnanofaasAotConfig is empty: name a YAML file, or leave the flag out')
    }
    def aotConfigFile = rootProject.file(aotConfig.toString())
    if (aotConfigFile.absolutePath.contains(',')) {
        throw new GradleException("-PnanofaasAotConfig: ${aotConfigFile} contains a comma, which " +
                'spring.config.additional-location reads as a list separator; move the file or the checkout')
    }
    tasks.named('processAot') {
        inputs.file(aotConfigFile).withPropertyName('nanofaasAotConfig')
        systemProperty 'spring.config.additional-location', 'file:' + aotConfigFile.absolutePath
    }
}
// Test AOT - @MockBean is incompatible with AOT, always disable
tasks.named('processTestAot') { enabled = false }
tasks.named('compileAotTestJava') { enabled = false }
tasks.named('processAotTestResources') { enabled = false }
tasks.named('aotTestClasses') { enabled = false }

tasks.named('bootJar') {
    doFirst {
        if (!nativeBuildRequested) {
            manifest.attributes.remove('Spring-Boot-Native-Processed')
        }
    }
}

tasks.named('bootBuildImage') {
    doFirst {
        throw new GradleException('Native buildpacks are disabled; run scripts/native-java-image.sh control-plane instead')
    }
}

// Il classpath di test, per i banchi di misura fuori da Gradle
// (docs/experiments/*/run.sh). Non e' un task di build: serve solo a evitare
// che un banco debba indovinare dove stanno i jar.
tasks.register('printTestClasspath') {
    doLast {
        println sourceSets.test.runtimeClasspath.asPath
    }
}
