server:
  port: 8080

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  server:
    port: 8081
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      enabled: true
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

nanofaas:
  registry:
    path: "${NANOFAAS_REGISTRY_PATH:build/nanofaas/functions.json}"
  metrics:
    profile: basic
  admin:
    runtime-config:
      enabled: false
  deployment:
    # Optional backend id to prefer when multiple managed deployment providers are available.
    default-backend: ""
  execution-store:
    # Ritenzione di un esito che qualcuno puo' ancora leggere: un chiamante ASYNC,
    # che dell'esecuzione ha solo l'id, o un retry che replica una chiave.
    ttl: 5m
    # Ritenzione dell'esito di una sincrona senza chiave, la cui risposta e' gia'
    # tornata sulla connessione del chiamante.
    sync-ttl: 30s
    # Tetto assoluto per un'esecuzione incastrata (dispatch perso, callback mai arrivata).
    max-lifetime: 30m
    # Il limite in NUMERO, non solo nel tempo. Senza, la memoria resta proporzionale
    # al tasso di arrivo: il 2026-08-23 erano 1,05 GB e il 50,6% del tempo in GC.
    # Un esito compatto misura 116 byte, quindi questo tetto costa circa 12 MB.
    max-outcomes: 100000
    # Il tetto in numero per le chiavi di idempotenza (vincoli e tombstone), separato
    # dal budget degli esiti: espellere un esito per capacita' non deve mai espellere
    # la deduplicazione. A budget esaurito una NUOVA ammissione con chiave viene
    # rifiutata (429) prima del dispatch; i replay delle chiavi gia' presenti restano
    # servibili. Dimensionarlo come `tasso di ammissioni con chiave x (maxLifetime + ttl)`.
    max-keys: 100000
    # Il tetto in BYTE degli esiti trattenuti. Quello in numero qui sopra presuppone che
    # pesino tutti uguale: vero per un esito compatto (116 byte), falso per un esito
    # leggibile (ASYNC o con chiave), che trattiene il payload del chiamante. Misurati:
    # 20.000 esiti da 64 KB occupano 1,28 GB, e a max-outcomes=100000 sarebbero circa 6 GB.
    # Con il budget in byte l'heap resta piatto al variare della dimensione del payload.
    # Predefinito (0 = derivato): max-outcomes x 116 byte, cioe' lo stesso costo di prima
    # al limite. Alzarlo se si trattengono payload grandi e si vuole ritenzione piu' lunga.
    max-outcome-bytes: 0
  http-client:
    # Il pool di connessioni del dispatch. Prima era il provider GLOBALE di Reactor
    # Netty: nessun budget dichiarato, e soprattutto nessuno che lo chiudesse, quindi
    # le connessioni sopravvivevano al context che le aveva aperte. Adesso e' un bean
    # con un lifecycle, e questi tre numeri sono il budget.
    #
    # I default coincidono con quelli di Reactor Netty, di proposito: accorciare
    # l'attesa di acquisizione sembrava un guadagno grosso, ma il dispatcher avvolge
    # gia' la chiamata in .timeout(functionTimeout), che cancella anche l'acquisizione
    # pendente. Rimisurato con quella cancellazione, 45 s / 5 s / 1 s sono
    # indistinguibili, quindi il valore precedente resta
    # (docs/experiments/control-plane-tuning-2026-09/RISULTATI.md).
    max-connections: 500
    pending-acquire-max-count: 0        # 0 = derivato: due volte max-connections
    pending-acquire-timeout-ms: 45000
  defaults:
    timeoutMs: 30000
    concurrency: 4
    queueSize: 100
    maxRetries: 3
  rate:
    maxPerSecond: 1000000
  k8s:
    namespace: ""
    callbackUrl: "http://control-plane.default.svc.cluster.local:8080/v1/internal/executions"
  scaling:
    poll-interval-ms: 5000
    default-min-replicas: 1
    default-max-replicas: 10

sync-queue:
  enabled: true
  admission-enabled: true
  max-depth: 200
  max-estimated-wait: 2s
  max-queue-wait: 2s
  retry-after-seconds: 2
  throughput-window: 30s
  per-function-min-samples: 50
