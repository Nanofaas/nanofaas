name: nanoFaaS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test-java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.4
      - name: Run Tests
        run: ./gradlew test

      # The suite above now runs with every optional module loaded, which is what
      # ships. CoreOnlyApiTest asserts the opposite configuration — no-op enqueuer,
      # 501 on :enqueue — and self-skips whenever async-queue is on the classpath,
      # so it needs its own invocation. Module selection happens at configuration
      # time and cannot be varied inside a single build.
      - name: Run Core-Only Tests
        run: ./gradlew :control-plane:test -PcontrolPlaneModules=none --tests '*CoreOnlyApiTest'

      # concurrency-control now supports either queue provider (requires.oneOf).
      # sync-queue is defaultEnabled=false, so the main suite only ever exercises
      # async-queue; SyncConcurrencyControlE2eTest self-skips there.
      - name: Run Sync-Queue Concurrency Tests
        run: ./gradlew :control-plane-modules:concurrency-control:test :control-plane-modules:sync-queue:test -PcontrolPlaneModules=sync-queue,concurrency-control,runtime-config

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Run SDK and Example Tests
        run: |
          cd sdks/python
          uv run --extra test --with-editable . python -m pytest tests/

  test-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-08-11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: runtimes/watchdog
      - name: Install integration-test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq netcat-openbsd
      - name: Run watchdog tests
        timeout-minutes: 15
        run: |
          cargo test --manifest-path runtimes/watchdog/Cargo.toml
          bash runtimes/watchdog/test-local.sh
