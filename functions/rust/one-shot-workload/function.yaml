name: one-shot-workload-rust
image: nanofaas/rust-one-shot-workload:local
timeoutMs: 30000
concurrency: 1
executionMode: DEPLOYMENT
runtimeMode: HTTP
maxRetries: 0
env:
  FUNCTION_HANDLER: one-shot-workload
  NANOFAAS_MAX_CONCURRENT_HANDLERS: '1'
x-cli:
  build:
    context: ../../..
    dockerfile: functions/rust/one-shot-workload/Dockerfile
    push: false
catalog:
  family: one-shot-workload
  runtime: rust
  description: Deterministic configurable CPU and memory workload using the Rust SDK.
  defaultImage: 127.0.0.1:5000/nanofaas/rust-one-shot-workload:local
