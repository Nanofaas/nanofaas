plugins {
    id 'java-gradle-plugin'
}

group = 'it.unimib.datai.nanofaas'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.yaml:snakeyaml:2.7'
    implementation 'com.networknt:json-schema-validator:2.0.7'
    testImplementation gradleTestKit()
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

gradlePlugin {
    plugins {
        controlPlaneModules {
            id = 'it.unimib.datai.nanofaas.control-plane-modules'
            implementationClass = 'it.unimib.datai.nanofaas.gradle.ControlPlaneModulesPlugin'
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
