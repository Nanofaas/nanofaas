components:
  schemas:
    EnqueueResponse:
      type: object
      required: [executionId, status]
      properties:
        executionId:
          type: string
        status:
          type: string
          enum: [queued]

x-nanofaas-overlays:
  - operationId: invokeFunctionAsync
    patch:
      responses:
        '501': null
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnqueueResponse'
        '429':
          description: >-
            Too many requests. Returned for rate limiting, invocation quota admission or async
            queue saturation. Invocation quota failures use the core InvocationQuotaError body
            and Retry-After 1; other overload responses may have no body.
        '500':
          description: Enqueue failed
