name: GitOps Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.4
      - name: Run Tests
        run: ./gradlew test

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Run SDK and Example Tests
        run: |
          cd sdks/python
          uv run --extra test --with-editable . python -m pytest tests/

  test-watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtimes/watchdog
      - name: Install integration-test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq netcat-openbsd
      - name: Run watchdog tests
        timeout-minutes: 15
        run: |
          cargo test --manifest-path runtimes/watchdog/Cargo.toml
          bash runtimes/watchdog/test-local.sh
