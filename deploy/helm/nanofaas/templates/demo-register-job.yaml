{{- if .Values.demos.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-register-demos
  namespace: {{ include "nanofaas.namespace" . | quote }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.demos.registerJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.demos.registerJob.ttlSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: register
          image: {{ .Values.demos.registerJob.image | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail

              CP_API="http://{{ .Values.controlPlane.service.name }}:{{ .Values.controlPlane.service.ports.http }}"
              CP_MGMT="http://{{ .Values.controlPlane.service.name }}:{{ .Values.controlPlane.service.ports.actuator }}"

              echo "Waiting for control-plane readiness..."
              ready=0
              for i in $(seq 1 60); do
                if curl -sf "${CP_MGMT}/actuator/health/readiness" >/dev/null; then
                  echo "control-plane ready"
                  ready=1
                  break
                fi
                sleep 2
              done
              if [ "${ready}" -ne 1 ]; then
                echo "control-plane readiness check failed after timeout" >&2
                exit 1
              fi

              response_file=$(mktemp)
              trap 'rm -f "$response_file"' EXIT
              echo "Registering demo functions..."
              {{- range $f := .Values.demos.functions }}
              echo "  - {{ $f.name }}"
              status=$(curl -sS -o "$response_file" -w '%{http_code}' -X POST "${CP_API}/v1/functions" \
                -H 'Content-Type: application/json' \
                --data-binary @- <<'NANOFAAS_DEMO_SPEC'
              {{ toJson $f }}
              NANOFAAS_DEMO_SPEC
              )
              case "$status" in
                2??) ;;
                409)
                  # Preserve existing demos, including user edits. Confirm that this
                  # conflict refers to a readable function, rather than swallowing it.
                  curl -fsS "${CP_API}/v1/functions/{{ $f.name }}" >/dev/null
                  echo "    already registered; preserving existing function"
                  ;;
                *)
                  echo "Demo {{ $f.name }} registration failed: HTTP $status" >&2
                  cat "$response_file" >&2
                  exit 1
                  ;;
              esac
              {{- end }}

              echo "Done"
{{- end -}}
