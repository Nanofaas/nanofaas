    context: ../../..
    dockerfile: functions/javascript/handler-envelope/Dockerfile
    platform: linux/amd64
    push: true
catalog:
  family: handler-envelope
  runtime: javascript
  description: JavaScript probe for invocation body and headers.
  defaultImage: 127.0.0.1:5000/nanofaas/javascript-handler-envelope:e2e
