apiVersion: v2
name: nanofaas
description: Nanofaas control-plane + optional demo function registration
type: application
version: 0.19.0
appVersion: "0.19.0"
dependencies:
  - name: prometheus-adapter
    alias: hpa-metrics-adapter
    version: 5.3.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: hpa-metrics-adapter.enabled
  - name: kube-state-metrics
    version: 8.3.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-state-metrics.enabled
