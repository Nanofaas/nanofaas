# Default namespace is the Helm release namespace; this chart can optionally
# create the namespace object for convenience.
namespace:
  create: true
  name: nanofaas

controlPlane:
  replicaCount: 1
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    existingClaim: ""
  image:
    repository: ghcr.io/miciav/nanofaas/control-plane
    tag: v0.20.0
    pullPolicy: IfNotPresent
  service:
    name: control-plane
    type: ClusterIP
    ports:
      http: 8080
      actuator: 8081
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

rbac:
  create: true

serviceAccount:
  create: true
  name: nanofaas-control-plane

prometheus:
  # Install an internal Prometheus instance (OpenFaaS-style "bundled Prometheus").
  # This is meant for dev/POC and short retention; for long-term retention, scrape it externally.
  create: true
  image: prom/prometheus:v3.9.1
  retention: 15d
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    name: prometheus
    type: ClusterIP
    port: 9090
  pvc:
    enabled: false
    size: 10Gi
    storageClassName: ""
  rbac:
    create: true
  containerMetrics:
    enabled: false
    # Allowed values: kubelet, daemonset
    mode: kubelet
    kubelet:
      # Kubelet scrape typically uses the apiserver proxy and may need TLS verification disabled in dev clusters.
      insecureSkipVerify: true
    daemonset:
      image: gcr.io/cadvisor/cadvisor:v0.49.1
      port: 8080
      hostNetwork: false
      privileged: true
      tolerations: []
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
  # DEPRECATED: use prometheus.containerMetrics.* instead.
  kubeletResourceMetrics:
    enabled: false
    # Resource metrics scrape uses the apiserver proxy and typically needs skipping TLS verification in dev clusters.
    insecureSkipVerify: true

  # Basic Prometheus scrape annotations (works with "classic" Prometheus scrapers).
  scrape:
    enabled: true
    path: /actuator/prometheus
    portName: actuator
  # Prometheus Operator integration (requires ServiceMonitor CRD installed).
  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
    additionalLabels: {}

# What the HPA controller itself decided, which no other source records.
# Prometheus already carries the metric's *value* (function_dispatch_total, from
# which nanofaas_rps is derived), but not whether the controller managed to read
# it, what replica count it computed, or whether that count was clamped by
# minReplicas/maxReplicas. Those live only in the HPA object's status, and the
# object is deleted with the function. kube-state-metrics publishes them as
# series so they survive in Prometheus:
#   kube_horizontalpodautoscaler_status_desired_replicas
#   kube_horizontalpodautoscaler_status_current_replicas
#   kube_horizontalpodautoscaler_status_condition{condition="ScalingActive"}   - could it read the metric
#   kube_horizontalpodautoscaler_status_condition{condition="ScalingLimited"}  - was the decision clamped
# Enable it alongside hpa-metrics-adapter; on its own it measures nothing.
kube-state-metrics:
  enabled: false
  # Only the HPA collector: this exists to explain autoscaling decisions, and
  # the default set watches every object kind in the cluster, which on a lab
  # node is memory and scrape volume spent on series nobody queries.
  collectors:
    - horizontalpodautoscalers
  # The subchart already sets prometheus.io/scrape from `prometheusScrape`
  # (default true), and the existing `nanofaas-endpoints` job keeps every
  # annotated Service in this namespace — so discovery needs nothing from us.
  # Only the port annotation is missing, and that job reads it to pick the
  # target port.
  service:
    annotations:
      prometheus.io/port: "8080"
  prometheus:
    # ServiceMonitor off: this cluster runs plain Prometheus, not the operator.
    monitor:
      enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# The control plane creates HPA objects per function. Enable this shared
# cluster component only when at least one registered function uses HPA.
hpa-metrics-adapter:
  enabled: false
  prometheus:
    url: http://prometheus
    port: 9090
  rules:
    default: false
    external:
      - seriesQuery: 'function_inFlight{function!=""}'
        resources:
          overrides:
            kubernetes_namespace:
              resource: namespace
        name:
          matches: '^function_inFlight$'
          as: nanofaas_in_flight
        metricsQuery: 'max(<<.Series>>{<<.LabelMatchers>>})'
      # Request rate, the signal in_flight cannot be. In-flight concurrency is
      # throughput x service time; for a function answering in ~2ms it sits
      # below 1 at any realistic rate, and it is capped at the queue's
      # concurrency limit besides. A rate has neither problem: it tracks load
      # and has no ceiling.
      - seriesQuery: 'function_dispatch_total{function!=""}'
        resources:
          overrides:
            kubernetes_namespace:
              resource: namespace
        name:
          matches: '^function_dispatch_total$'
          as: nanofaas_rps
        # 1m, not 30s: the control plane is scraped every 5s, so a one-minute
        # window averages twelve samples and does not swing on a single slow
        # scrape. It also decays to zero within the 90s the load test allows
        # for scale-down, which is what scale-to-zero needs.
        metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m]))'
      # Backlog. Zero whenever the function keeps up, so it is a saturation
      # signal rather than a load signal — usable as a second metric, not as a
      # sole one. Present here because the type is registrable and translated,
      # and a registrable metric that nothing serves is a trap.
      - seriesQuery: 'function_queue_depth{function!=""}'
        resources:
          overrides:
            kubernetes_namespace:
              resource: namespace
        name:
          matches: '^function_queue_depth$'
          as: nanofaas_queue_depth
        metricsQuery: 'max(<<.Series>>{<<.LabelMatchers>>})'

demos:
  enabled: true
  # The job will register these functions via the control-plane API.
  # For DEPLOYMENT mode, the control-plane will provision Deployment/Service per function.
  functions:
    - name: word-stats-java
      image: ghcr.io/miciav/nanofaas/java-word-stats:v0.20.0
      timeoutMs: 10000
      concurrency: 2
      queueSize: 50
      maxRetries: 3
      executionMode: DEPLOYMENT
      scalingConfig:
        strategy: INTERNAL
        minReplicas: 1
        maxReplicas: 5
        metrics:
          - type: in_flight
            target: "2"
    - name: json-transform-java
      image: ghcr.io/miciav/nanofaas/java-json-transform:v0.20.0
      timeoutMs: 10000
