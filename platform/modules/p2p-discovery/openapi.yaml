paths:
  /v1/admin/p2p/information:
    get:
      summary: Read the local node information snapshot
      description: Cached observations, with sharing flags applied immediately. Requires P2P and admin enablement.
      responses:
        '200':
          description: Local snapshot with explicit per-category status and source age
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pNodeInformation'
        '404':
          description: P2P or its admin API is disabled
  /v1/admin/p2p/peers/{id}/information:
    get:
      summary: Read information received directly from a known neighbor
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CURRENT, NOT_RECEIVED, STALE or INACTIVE; only CURRENT carries a snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pRemoteInformation'
        '404':
          description: Unknown peer, or P2P or its admin API is disabled
  /v1/admin/p2p/state:
    get:
      summary: Read P2P participation state
      description: Available only when both the P2P module and its admin API are enabled.
      responses:
        '200':
          description: Current runtime participation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pState'
        '404':
          description: P2P module or admin API is disabled
    put:
      summary: Change P2P participation state
      description: 'ACTIVE resumes or rejoins. ISOLATED drops all P2P traffic without
        announcing departure,

        so peers detect failure through SWIM. LEFT announces departure and closes
        the transport.

        Transitions are idempotent and retain identity, configuration and peer modes.

        HTTP stays available. State is runtime only; restarting follows deployment
        configuration.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/P2pState'
      responses:
        '200':
          description: Transition completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pState'
        '400':
          description: Invalid state or unexpected fields
        '404':
          description: P2P module or admin API is disabled
        '409':
          description: Service is unavailable or the transition failed
  /v1/admin/p2p/peers:
    get:
      summary: List the peers known to the p2p-discovery module
      description: Available only when `nanofaas.p2p.enabled=true` and `nanofaas.p2p.admin.enabled=true`.
      operationId: listP2pPeers
      responses:
        '200':
          description: Known peers with their latency, coordinates and whether they
            are active neighbors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/P2pPeer'
        '404':
          description: p2p admin API is disabled
  /v1/admin/p2p/peers/{id}:
    put:
      summary: Set how a peer is treated (AUTO, FORCE_ACTIVE, EXCLUDED)
      description: 'Available only when `nanofaas.p2p.enabled=true` and `nanofaas.p2p.admin.enabled=true`.

        The peer does not need to be known yet. `AUTO` removes a previous runtime
        mode.

        When a `state-file` is configured, the change is written to it (asynchronously,
        shortly after the response).

        '
      operationId: setP2pPeerMode
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/P2pPeerModeRequest'
      responses:
        '200':
          description: Mode applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  mode:
                    $ref: '#/components/schemas/P2pPeerMode'
        '400':
          description: Missing or unknown mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pError'
        '404':
          description: p2p admin API is disabled
  /v1/admin/p2p/config:
    get:
      summary: Get the effective neighbor-selection settings and the runtime overrides
      description: Available only when `nanofaas.p2p.enabled=true` and `nanofaas.p2p.admin.enabled=true`.
      operationId: getP2pConfig
      responses:
        '200':
          description: Effective settings and overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pConfigView'
        '404':
          description: p2p admin API is disabled
    patch:
      summary: Override neighbor-selection settings at runtime
      description: 'Available only when `nanofaas.p2p.enabled=true` and `nanofaas.p2p.admin.enabled=true`.

        A key set to `null` means "not applied" (for example `maxLatencyMs: null`
        removes the latency threshold).

        Overrides win over the state file''s `config` section and over `application.yml`,
        and, when a `state-file` is configured, are written to it (asynchronously,
        shortly after the response).

        '
      operationId: patchP2pConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/P2pConfigPatch'
      responses:
        '200':
          description: Settings applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pConfigView'
        '400':
          description: Unknown key, or `maxNeighbors` not an integer >= 0, or `maxLatencyMs`
            not a number > 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pError'
        '404':
          description: p2p admin API is disabled
  /v1/admin/p2p/overrides:
    delete:
      summary: Drop every runtime override (settings and per-peer modes set through
        the API)
      description: Available only when `nanofaas.p2p.enabled=true` and `nanofaas.p2p.admin.enabled=true`.
      operationId: clearP2pOverrides
      responses:
        '200':
          description: Overrides cleared; the file `config` and `application.yml`
            apply again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/P2pConfigView'
        '404':
          description: p2p admin API is disabled
components:
  schemas:
    P2pNodeInformation:
      type: object
      required: [schemaVersion, nodeId, sampledAt, functions, images, resources]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        nodeId: {type: string}
        sampledAt: {type: string, format: date-time}
        functions:
          allOf:
            - $ref: '#/components/schemas/P2pInformationCategory'
            - type: object
              properties:
                data:
                  type: array
                  nullable: true
                  maxItems: 5000
                  items:
                    $ref: '#/components/schemas/P2pFunctionInformation'
        images:
          allOf:
            - $ref: '#/components/schemas/P2pInformationCategory'
            - type: object
              properties:
                data:
                  allOf:
                    - $ref: '#/components/schemas/P2pImageInventory'
                  nullable: true
        resources:
          allOf:
            - $ref: '#/components/schemas/P2pInformationCategory'
            - type: object
              properties:
                data:
                  allOf:
                    - $ref: '#/components/schemas/P2pResourceInformation'
                  nullable: true
    P2pInformationCategory:
      type: object
      description: At most 300 KiB encoded. DISABLED and UNAVAILABLE have null data;
        AVAILABLE and PARTIAL include source metadata. Samples expire at 15000 ms of monotonic source age.
      required: [status, ageMillis]
      properties:
        status: {type: string, enum: [AVAILABLE, PARTIAL, DISABLED, UNAVAILABLE]}
        collectedAt: {type: string, format: date-time, nullable: true}
        source: {type: string, nullable: true}
        scope: {type: string, nullable: true}
        reasonCode: {type: string, nullable: true}
        ageMillis: {type: integer, format: int64, minimum: 0}
    P2pFunctionInformation:
      type: object
      required: [name, executionMode]
      properties:
        name: {type: string}
        executionMode: {type: string, enum: [LOCAL, EXTERNAL, DEPLOYMENT]}
        image: {type: string, nullable: true}
        backend: {type: string, nullable: true}
    P2pImageInventory:
      type: object
      required: [backend, scope, collectedAt, status, entries]
      properties:
        backend: {type: string}
        scope: {type: string}
        collectedAt: {type: string, format: date-time}
        status: {type: string, enum: [AVAILABLE, PARTIAL, UNAVAILABLE]}
        reasonCode: {type: string, nullable: true}
        entries:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [references]
            properties:
              nodeId: {type: string, nullable: true}
              references: {type: array, items: {type: string}}
              digest: {type: string, nullable: true}
              imageId: {type: string, nullable: true}
    P2pResourceInformation:
      type: object
      description: Observed control-plane-visible environment, process, JVM heap and per-function workload.
        Missing measurements remain null. CPU ratios are in [0,1], memory values are bytes.
      properties:
        environmentCpuRatio: {type: number, minimum: 0, maximum: 1, nullable: true}
        environmentMemoryUsedBytes: {type: integer, format: int64, minimum: 0, nullable: true}
        environmentMemoryTotalBytes: {type: integer, format: int64, minimum: 0, nullable: true}
        processCpuRatio: {type: number, minimum: 0, maximum: 1, nullable: true}
        jvmHeapUsedBytes: {type: integer, format: int64, minimum: 0, nullable: true}
        jvmHeapMaxBytes: {type: integer, format: int64, minimum: 0, nullable: true}
        functions:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [name, queueDepth, inFlight, effectiveConcurrency, dispatchableBacklog]
            properties:
              name: {type: string}
              queueDepth: {type: integer, minimum: 0}
              inFlight: {type: integer, minimum: 0}
              effectiveConcurrency: {type: integer, minimum: 0}
              dispatchableBacklog: {type: integer, minimum: 0}
    P2pRemoteInformation:
      type: object
      required: [nodeId, state]
      properties:
        nodeId: {type: string}
        state: {type: string, enum: [CURRENT, NOT_RECEIVED, STALE, INACTIVE]}
        information:
          allOf:
            - $ref: '#/components/schemas/P2pNodeInformation'
          nullable: true
    P2pState:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - ACTIVE
          - ISOLATED
          - LEFT
    P2pPeerMode:
      type: string
      enum:
      - AUTO
      - FORCE_ACTIVE
      - EXCLUDED
    P2pPeerModeRequest:
      type: object
      required:
      - mode
      properties:
        mode:
          $ref: '#/components/schemas/P2pPeerMode'
    P2pPeer:
      type: object
      required:
      - id
      - address
      - mode
      - active
      - reason
      properties:
        id:
          type: string
        address:
          type: string
          description: host:port of the peer's cluster transport
        mode:
          $ref: '#/components/schemas/P2pPeerMode'
        rttMs:
          type: number
          nullable: true
          description: Median measured round-trip time; a value restored from the
            state file is shown until the first fresh measurement
        coord:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Vivaldi coordinates of the peer
        active:
          type: boolean
        reason:
          type: string
          enum:
          - selected
          - forced
          - excluded
          - latency
          - no-measurement
          - over-max-neighbors
          - unavailable
    P2pConfigPatch:
      type: object
      description: Neighbor limits and three independent sharing flags. Sharing flags require booleans;
        numeric limit nulls retain their existing meaning. Patches are atomic.
      properties:
        shareFunctions:
          type: boolean
        shareImages:
          type: boolean
        shareResources:
          type: boolean
        maxNeighbors:
          type: integer
          minimum: 0
          nullable: true
        maxLatencyMs:
          type: number
          minimum: 0
          exclusiveMinimum: true
          nullable: true
    P2pConfigView:
      type: object
      required:
      - effective
      - overrides
      properties:
        effective:
          type: object
          properties:
            shareFunctions:
              type: boolean
            shareImages:
              type: boolean
            shareResources:
              type: boolean
            maxNeighbors:
              type: integer
              nullable: true
            maxLatencyMs:
              type: number
              nullable: true
        overrides:
          type: object
          additionalProperties: true
    P2pError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
