[SERVICE]
    Flush                     1
    Grace                     10
    Log_Level                 info
    Parsers_File              /fluent-bit/etc/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/chunks
    storage.sync              full
    storage.checksum          On
    storage.max_chunks_up     8
    storage.backlog.mem_limit  8M
    storage.metrics           On

[INPUT]
    Name              tail
    Tag               nanofaas.docker
    Path              /var/log/containers/*/*-json.log
    Parser            docker
    DB                /var/lib/fluent-bit/tail.db
    DB.Sync           Full
    Read_from_Head    On
    Refresh_Interval  1
    Rotate_Wait       10
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    storage.type      filesystem

[FILTER]
    Name         parser
    Match        nanofaas.*
    Key_Name     log
    Parser       nanofaas_json
    Reserve_Data On
    Preserve_Key Off

[FILTER]
    Name  modify
    Match nanofaas.*
    Set   nodeId ${NANOFAAS_NODE_ID}
    Set   environment ${NANOFAAS_ENVIRONMENT}
    Set   campaignId ${NANOFAAS_CAMPAIGN_ID}
    Set   runId ${NANOFAAS_RUN_ID}
    Set   mode ${NANOFAAS_MODE}
    Set   nodeRole ${NANOFAAS_NODE_ROLE}
    Add   service unstructured
    Hard_copy service lokiService
    Hard_copy nodeId lokiNode
    Hard_copy environment lokiEnvironment

[OUTPUT]
    Name                     loki
    Match                    nanofaas.*
    Host                     ${LOKI_HOST}
    Port                     ${LOKI_PORT}
    URI                      ${LOKI_URI}
    tls                      ${LOKI_TLS}
    tls.verify               On
    Labels                   job=nanofaas,node=$lokiNode,environment=$lokiEnvironment,service=$lokiService
    Line_Format              json
    Retry_Limit              False
    storage.total_limit_size ${NANOFAAS_LOG_BUFFER_SIZE}
