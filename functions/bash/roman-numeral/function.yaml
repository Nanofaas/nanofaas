name: roman-numeral-exec
image: nanofaas/roman-numeral:latest
timeoutMs: 10000
concurrency: 2
executionMode: DEPLOYMENT

x-cli:
  build:
    context: ../../..
    dockerfile: functions/bash/roman-numeral/Dockerfile
    platform: linux/amd64
    push: true

catalog:
  family: roman-numeral
  runtime: exec
  description: Exec/watchdog roman numeral conversion demo.
  defaultImage: 127.0.0.1:5000/nanofaas/bash-roman-numeral:e2e
  defaultPayload: roman-numeral-sample.json
