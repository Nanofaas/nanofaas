name: qr-code-go
image: nanofaas/qr-code:latest
timeoutMs: 10000
concurrency: 2
executionMode: DEPLOYMENT

x-cli:
  build:
    context: ../../..
    dockerfile: functions/go/qr-code/Dockerfile
    platform: linux/amd64
    push: true

catalog:
  family: qr-code
  runtime: go
  description: Go PNG QR code generation demo.
  defaultImage: localhost:5000/nanofaas/go-qr-code:e2e
