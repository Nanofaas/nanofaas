server:
  port: 8080

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  server:
    port: 8081
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      enabled: true
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

nanofaas:
  registry:
    path: "${NANOFAAS_REGISTRY_PATH:build/nanofaas/functions.json}"
  metrics:
    profile: basic
  admin:
    runtime-config:
      enabled: false
  deployment:
    # Optional backend id to prefer when multiple managed deployment providers are available.
    default-backend: ""
  execution-store:
    # Ritenzione di un esito che qualcuno puo' ancora leggere: un chiamante ASYNC,
    # che dell'esecuzione ha solo l'id, o un retry che replica una chiave.
    ttl: 5m
    # Ritenzione dell'esito di una sincrona senza chiave, la cui risposta e' gia'
    # tornata sulla connessione del chiamante.
    sync-ttl: 30s
    # Tetto assoluto per un'esecuzione incastrata (dispatch perso, callback mai arrivata).
    max-lifetime: 30m
    # Il limite in NUMERO, non solo nel tempo. Senza, la memoria resta proporzionale
    # al tasso di arrivo: il 2026-08-23 erano 1,05 GB e il 50,6% del tempo in GC.
    # Un esito compatto misura 116 byte, quindi questo tetto costa circa 12 MB.
    max-outcomes: 100000
  defaults:
    timeoutMs: 30000
    concurrency: 4
    queueSize: 100
    maxRetries: 3
  rate:
    maxPerSecond: 1000000
  k8s:
    namespace: ""
    callbackUrl: "http://control-plane.default.svc.cluster.local:8080/v1/internal/executions"
  scaling:
    poll-interval-ms: 5000
    default-min-replicas: 1
    default-max-replicas: 10

sync-queue:
  enabled: true
  admission-enabled: true
  max-depth: 200
  max-estimated-wait: 2s
  max-queue-wait: 2s
  retry-after-seconds: 2
  throughput-window: 30s
  per-function-min-samples: 50
