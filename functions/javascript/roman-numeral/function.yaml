name: roman-numeral
image: nanofaas/roman-numeral:latest
timeoutMs: 10000
concurrency: 2
executionMode: DEPLOYMENT

x-cli:
  build:
    context: ../../..
    dockerfile: functions/javascript/roman-numeral/Dockerfile
    platform: linux/amd64
    push: true

catalog:
  family: roman-numeral
  runtime: javascript
  description: Node.js JavaScript roman numeral conversion demo.
  defaultImage: localhost:5000/nanofaas/javascript-roman-numeral:e2e
  defaultPayload: roman-numeral-sample.json
