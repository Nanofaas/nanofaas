plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
    id 'org.graalvm.buildtools.native'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    api project(':common')
    api 'org.springframework.boot:spring-boot-starter-web'
    // Not spring-boot-starter-actuator: this SDK deliberately serves its own /health and /metrics
    // (see HealthController/MetricsController) instead of Actuator's management endpoints. This
    // narrower starter keeps the JVM/system meter-binder autoconfiguration those controllers need
    // without pulling in the unused actuator endpoint machinery.
    api 'org.springframework.boot:spring-boot-starter-micrometer-metrics'
    api 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    // Exercise the real dispatcher without importing module auto-configurations into SDK contexts.
    testImplementation files(rootProject.project(':control-plane').tasks.named('compileJava').map { it.destinationDirectory })
    testImplementation project(':control-plane-spi')
    testImplementation project(':execution-runtime')
    testImplementation 'io.projectreactor.netty:reactor-netty-http'
    testImplementation 'org.springframework:spring-webflux'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    inputs.files(rootProject.files('sdks/runtime-contract/saturation-wire-corpus.json',
            'sdks/runtime-contract/failure-wire-corpus.json',
            'sdks/runtime-contract/validate_saturation_wire_corpus.py'))
            .withPropertyName('sharedRuntimeContracts')
}
