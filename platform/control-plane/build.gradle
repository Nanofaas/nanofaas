plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.graalvm.buildtools.native'
}

def selectedOptionalControlPlaneModuleNames = gradle.ext.nanofaasSelectedControlPlaneModules
def selectedOptionalControlPlaneModuleProjects = rootProject.subprojects
        .findAll { selectedOptionalControlPlaneModuleNames.contains(it.name) }

dependencies {
    implementation project(':common')
    implementation 'com.github.ben-manes.caffeine:caffeine'
    selectedOptionalControlPlaneModuleProjects.each { moduleProject ->
        runtimeOnly project(moduleProject.path)
    }
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testImplementation 'org.springframework.boot:spring-boot-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-webtestclient'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers:2.0.5'
    testImplementation 'org.awaitility:awaitility:4.3.0'
}

tasks.register('printSelectedControlPlaneModules') {
    group = 'help'
    description = 'Print the control-plane modules included in this build.'
    doLast {
        def names = selectedOptionalControlPlaneModuleNames
        if (names.isEmpty()) {
            println 'No optional control-plane modules selected.'
        } else {
            println "Selected control-plane modules: ${names.join(', ')}"
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // OpenApiRouteCoverageTest and IssueCoverageTest read repo files; without declaring them the
    // task stays UP-TO-DATE when only the spec or a doc changes, and never notices the drift.
    inputs.files(
            rootProject.file('openapi/core.yaml'),
            rootProject.fileTree('platform/modules') { include '*/openapi.yaml' },
            rootProject.file('docs/slo.md'),
            rootProject.file('docs/quickstart.md'),
            rootProject.file('docs/example-function.md')
    ).withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty 'project.version', project.version.toString()
    systemProperty 'nanofaas.selectedControlPlaneModules', selectedOptionalControlPlaneModuleProjects.collect { it.name }.sort().join(',')
    dependsOn 'bootJar'
    dependsOn ':services:java:warm-echo:bootJar'
    dependsOn ':functions:java:word-stats:bootJar'
    dependsOn ':functions:java:json-transform:bootJar'
    dependsOn ':functions:java:roman-numeral:bootJar'
    dependsOn ':functions:java:figlet:bootJar'
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('jar') {
    // Keep a plain JAR consumable so optional modules can compile against control-plane types.
    enabled = true
}

graalvmNative {
    binaries {
        main {
            // Kubernetes-oriented optional modules may still rely on SnakeYAML charsets.
            buildArgs.add('-H:+AddAllCharsets')
        }
    }
}

// Enable Spring AOT processing only for native-oriented builds.
def nativeBuildRequested = gradle.startParameter.taskNames.any {
    def taskName = it.toLowerCase()

    taskName.contains('nativecompile') || taskName.contains('nativetest')
}

if (!nativeBuildRequested) {
    // Main AOT - not needed for regular builds
    tasks.named('processAot') { enabled = false }
    tasks.named('compileAotJava') { enabled = false }
    tasks.named('processAotResources') { enabled = false }
    tasks.named('aotClasses') { enabled = false }
}
// Test AOT - @MockBean is incompatible with AOT, always disable
tasks.named('processTestAot') { enabled = false }
tasks.named('compileAotTestJava') { enabled = false }
tasks.named('processAotTestResources') { enabled = false }
tasks.named('aotTestClasses') { enabled = false }

tasks.named('bootJar') {
    doFirst {
        if (!nativeBuildRequested) {
            manifest.attributes.remove('Spring-Boot-Native-Processed')
        }
    }
}

tasks.named('bootBuildImage') {
    doFirst {
        throw new GradleException('Native buildpacks are disabled; run scripts/native-java-image.sh control-plane instead')
    }
}
