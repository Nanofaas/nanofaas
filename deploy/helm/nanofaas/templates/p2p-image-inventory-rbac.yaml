{{- if and .Values.rbac.create .Values.rbac.nodeImageInventory }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-p2p-images" .Release.Name (include "nanofaas.namespace" .) | trunc 63 | trimSuffix "-" }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-p2p-images" .Release.Name (include "nanofaas.namespace" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | quote }}
    namespace: {{ include "nanofaas.namespace" . | quote }}
roleRef:
  kind: ClusterRole
  name: {{ printf "%s-%s-p2p-images" .Release.Name (include "nanofaas.namespace" .) | trunc 63 | trimSuffix "-" }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
