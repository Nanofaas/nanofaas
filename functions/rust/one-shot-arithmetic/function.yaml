name: one-shot-arithmetic-rust
image: nanofaas/rust-one-shot-arithmetic:local
timeoutMs: 30000
concurrency: 1
executionMode: DEPLOYMENT
runtimeMode: HTTP
maxRetries: 0
env:
  FUNCTION_HANDLER: one-shot-arithmetic
  NANOFAAS_MAX_CONCURRENT_HANDLERS: '1'
x-cli:
  build:
    context: ../../..
    dockerfile: functions/rust/one-shot-arithmetic/Dockerfile
    push: false
catalog:
  family: one-shot-arithmetic
  runtime: rust
  description: Integer recurrence using the Rust SDK.
  defaultImage: 127.0.0.1:5000/nanofaas/rust-one-shot-arithmetic:local
