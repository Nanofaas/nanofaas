schemaVersion: 2
name: forecasting-java-only
registry:
  repository: nanofaas
  tag: wasm-local
controlPlane:
  modules: [forecasting, runtime-config, build-metadata]
  build:
    mode: jvm
  jvm:
    args: ["-XX:+UseSerialGC", "-Xmx64m"]
  container: {image: forecasting-java-only}
  config:
    nanofaas:
      admin:
        runtime-config:
          enabled: true
      forecasting:
        enabled: true
        node-id: local
        provider: holt
        window: 1s
        max-age: 1m
