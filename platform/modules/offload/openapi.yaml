x-nanofaas-overlays:
  - operationId: invokeFunctionSync
    patch:
      description: With one-shot routing, a validated neighbor request carrying an earlier epoch assignment remains eligible for bounded local queue admission during and after allocation changes. Execution uses current available capacity and ordinary timeouts. The previous grant does not reserve current capacity; received requests cannot be forwarded again. Current-epoch grants retain readiness and quota checks.
      responses:
        '200':
          headers:
            X-NanoFaaS-Execution-Node:
              schema:
                type: string
              description: Trusted node attribution after execution, preserved on idempotent replay; absent when execution was not attributed.
            X-NanoFaaS-Offloaded:
              schema:
                type: string
              description: Present and set to the remote target URL when this invocation was proxied to a remote nanofaas instance.
        '502':
          description: The invocation was offloaded to a remote instance and that instance failed. There is no local fallback.
          headers:
            X-NanoFaaS-Offloaded:
              schema:
                type: string
              description: Present and set to the remote target URL when this invocation was proxied to a remote nanofaas instance.
        '504':
          description: The invocation was offloaded to a remote instance and that instance timed out.
          headers:
            X-NanoFaaS-Offloaded:
              schema:
                type: string
              description: Present and set to the remote target URL when this invocation was proxied to a remote nanofaas instance.

paths: {"/v1/admin/offload/one-shot/config": {"put": {"operationId": "replaceOneShotConfig", "summary": "Replace next-epoch one-shot configuration", "description": "Available only when one-shot is explicitly enabled. Bodies are bounded to 8 MiB. Profiles, clock and input eligibility fail closed.", "parameters": [{"in": "header", "name": "If-Match", "required": true, "schema": {"type": "integer", "format": "int64", "minimum": 0}}], "responses": {"200": {"description": "Current state or installed immutable revision", "content": {"application/json": {"schema": {"type": "object"}}}}, "400": {"description": "Invalid input or incompatible calibration"}, "409": {"description": "Revision, ownership, mode, preparation or frozen schedule grid conflict"}, "413": {"description": "Body exceeds 8 MiB"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OneShotConfig"}}}}}}, "/v1/admin/offload/one-shot/profiles/{id}": {"put": {"operationId": "replaceOneShotProfile", "summary": "Install content-verified calibration evidence", "description": "Available only when one-shot is explicitly enabled. Bodies are bounded to 8 MiB. Profiles, clock and input eligibility fail closed.", "parameters": [{"in": "header", "name": "If-Match", "required": true, "schema": {"type": "integer", "format": "int64", "minimum": 0}}, {"in": "path", "name": "id", "required": true, "schema": {"type": "string", "maxLength": 256}}, {"in": "header", "name": "X-Content-SHA256", "required": true, "schema": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"}}], "responses": {"200": {"description": "Current state or installed immutable revision", "content": {"application/json": {"schema": {"type": "object"}}}}, "400": {"description": "Invalid input or incompatible calibration"}, "409": {"description": "Revision, ownership, mode, preparation or frozen schedule grid conflict"}, "413": {"description": "Body exceeds 8 MiB"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OneShotServiceProfile"}}}}}}, "/v1/admin/offload/one-shot/status": {"get": {"operationId": "getOneShotStatus", "summary": "Inspect clock, revision and active ready plan", "description": "Inspect protocol schema version, configured sessionId for v2, active ready plan and diagnostic clock health. Clock health does not authorize v2 negotiation or activation.", "parameters": [], "responses": {"200": {"description": "Current state or installed immutable revision", "content": {"application/json": {"schema": {"type": "object"}}}}, "400": {"description": "Invalid input or incompatible calibration"}, "409": {"description": "Revision, ownership, mode, preparation or frozen schedule grid conflict"}, "413": {"description": "Body exceeds 8 MiB"}}}}, "/v1/admin/offload/one-shot/epochs/{epoch}/events": {"get": {"operationId": "getOneShotEpochEvents", "summary": "Read bounded cursor-based events", "description": "Available only when one-shot is explicitly enabled. Bodies are bounded to 8 MiB. Profiles, clock and input eligibility fail closed.", "parameters": [{"in": "path", "name": "epoch", "required": true, "schema": {"type": "integer", "format": "int64", "minimum": 0}}, {"in": "query", "name": "after", "schema": {"type": "integer", "format": "int64", "default": 0}}, {"in": "query", "name": "limit", "schema": {"type": "integer", "minimum": 1, "maximum": 1000, "default": 100}}], "responses": {"200": {"description": "Current state or installed immutable revision", "content": {"application/json": {"schema": {"type": "object"}}}}, "400": {"description": "Invalid input or incompatible calibration"}, "409": {"description": "Revision, ownership, mode, preparation or frozen schedule grid conflict"}, "413": {"description": "Body exceeds 8 MiB"}}}}, "/v1/admin/offload/one-shot/epochs/{epoch}/prepare": {"post": {"operationId": "prepareOneShotEpoch", "summary": "Prepare a legacy v1 epoch when scheduling is disabled", "description": "Available only when one-shot is explicitly enabled. Bodies are bounded to 8 MiB. Profiles, clock and input eligibility fail closed.", "parameters": [{"in": "path", "name": "epoch", "required": true, "schema": {"type": "integer", "format": "int64", "minimum": 0}}], "responses": {"200": {"description": "Current state or installed immutable revision", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OneShotPlanActivation"}}}}, "400": {"description": "Invalid input or incompatible calibration"}, "409": {"description": "Revision, ownership, mode, preparation or frozen schedule grid conflict"}, "413": {"description": "Body exceeds 8 MiB"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OneShotWindow"}}}}}}, "/v1/admin/offload/one-shot/clock-health": {"put": {"operationId": "replaceOneShotClockHealth", "summary": "Report externally measured UTC offset without refreshing old timestamps", "description": "Available only when one-shot is explicitly enabled. Bodies are bounded to 8 MiB. Profiles, clock and input eligibility fail closed.", "parameters": [], "responses": {"200": {"description": "Current state or installed immutable revision", "content": {"application/json": {"schema": {"type": "object"}}}}, "400": {"description": "Invalid input or incompatible calibration"}, "409": {"description": "Revision, ownership, mode, preparation or frozen schedule grid conflict"}, "413": {"description": "Body exceeds 8 MiB"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OneShotClockSample"}}}}}}, "/v1/admin/offload/one-shot/drain-and-release": {"post": {"operationId": "drainOneShotOwnership", "summary": "Release ownership after commitment expiry and positive physical drain", "description": "Available only when one-shot is explicitly enabled. Bodies are bounded to 8 MiB. Profiles, clock and input eligibility fail closed.", "parameters": [], "responses": {"200": {"description": "Current state or installed immutable revision", "content": {"application/json": {"schema": {"type": "boolean"}}}}, "400": {"description": "Invalid input or incompatible calibration"}, "409": {"description": "Revision, ownership, mode, preparation or frozen schedule grid conflict"}, "413": {"description": "Body exceeds 8 MiB"}}}}, "/v1/admin/offload/one-shot/sessions/{sessionId}/epochs/{epoch}/prepare": {"post": {"operationId": "negotiateLogicalOneShotEpoch", "summary": "Negotiate a v2 session epoch without changing its physical allocation", "description": "Requires schemaVersion 2 and its configured sessionId. UTC labels must equal anchor + epoch * period and identify inputs only. activationDelay is a positive relative monotonic budget captured before input pinning. NEGOTIATED requires a separate activate call. Manual calls require scheduled=false.", "parameters": [{"in": "path", "name": "sessionId", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 256}}, {"in": "path", "name": "epoch", "required": true, "schema": {"type": "integer", "format": "int64", "minimum": 0}}], "responses": {"200": {"description": "Current state or installed immutable revision", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OneShotPlanActivation"}}}}, "400": {"description": "Invalid input or incompatible calibration"}, "409": {"description": "Revision, ownership, mode, preparation or frozen schedule grid conflict"}, "413": {"description": "Body exceeds 8 MiB"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OneShotLogicalWindow"}}}}}}, "/v1/admin/offload/one-shot/sessions/{sessionId}/epochs/{epoch}/activate": {"post": {"operationId": "activateLogicalOneShotEpoch", "summary": "Activate the negotiated v2 allocation", "description": "Retires the old routing plan and performs the physical transition. Repeating activation of the same staged epoch returns its cached outcome without reallocating. Superseded, expired, or different sessions fail. READY or PREPARED is not an assertion of mathematical convergence.", "parameters": [{"in": "path", "name": "sessionId", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 256}}, {"in": "path", "name": "epoch", "required": true, "schema": {"type": "integer", "format": "int64", "minimum": 0}}], "responses": {"200": {"description": "Current state or installed immutable revision", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OneShotPlanActivation"}}}}, "400": {"description": "Invalid input or incompatible calibration"}, "409": {"description": "Revision, ownership, mode, preparation or frozen schedule grid conflict"}, "413": {"description": "Body exceeds 8 MiB"}}}}, "/v1/admin/offload/one-shot/sessions/{sessionId}/start": {"post": {"operationId": "startLogicalOneShotSession", "summary": "Arm a qualified automatic logical session", "description": "Requires schemaVersion 2, scheduled=true, and at least 20 complete qualified operational samples. firstEpoch must advance beyond the local preparation fence; use zero only for a fresh fence. Repeating an identical start is idempotent. Local monotonic timers and validated neighbor proposals initiate fixed-round auctions. Activation uses local monotonic delay. Disable scheduling to disarm. Restart requires explicit rearming; wall time never selects an epoch.", "parameters": [{"in": "path", "name": "sessionId", "required": true, "schema": {"type": "string", "minLength": 1, "maxLength": 256}}], "responses": {"200": {"description": "Current state or installed immutable revision", "content": {"application/json": {"schema": {"type": "object"}}}}, "400": {"description": "Invalid input or incompatible calibration"}, "409": {"description": "Revision, ownership, mode, preparation or frozen schedule grid conflict"}, "413": {"description": "Body exceeds 8 MiB"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OneShotSessionStart"}}}}}}}
