name = "k8s-demo-java"
base_scenario = "k3s-junit-curl"
runtime = "java"
function_preset = "demo-java"
namespace = "nanofaas-e2e"
local_registry = "localhost:5000"

[invoke]
mode = "smoke"
payload_dir = "payloads"

[payloads]
word-stats-java = "word-stats-sample.json"
json-transform-java = "json-transform-sample.json"

[resources.word-stats-java.requests]
cpu = 0.25
memoryMiB = 256

[resources.word-stats-java.limits]
cpu = 0.5
memoryMiB = 512

[load]
profile = "quick"
targets = ["word-stats-java", "json-transform-java"]
