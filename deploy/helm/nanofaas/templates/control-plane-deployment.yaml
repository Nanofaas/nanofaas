apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanofaas-control-plane
  namespace: {{ include "nanofaas.namespace" . | quote }}
  labels:
    {{- include "nanofaas.controlPlane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "nanofaas.controlPlane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nanofaas.controlPlane.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          {{- $ioWorkerCount := .Values.controlPlane.jvm.ioWorkerCount | default (include "nanofaas.controlPlane.ioWorkerCount" .) }}
          # A native image never reads JAVA_TOOL_OPTIONS (only the HotSpot launcher does), so the
          # event-loop count set there below is also passed as an argument. The native binary
          # parses -D from its command line; a JVM image, whose ENTRYPOINT ends in -jar, receives
          # it as a non-option program argument that Spring Boot ignores.
          args:
            - "-Dreactor.netty.ioWorkerCount={{ $ioWorkerCount }}"
          ports:
            - containerPort: {{ .Values.controlPlane.service.ports.http }}
            - containerPort: {{ .Values.controlPlane.service.ports.actuator }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NANOFAAS_REGISTRY_PATH
              value: /var/lib/nanofaas/functions.json
            # The URL function pods call back on. application.yml's default names the
            # `default` namespace, which a release in any other namespace does not serve:
            # every callback then failed. Derived from this release's Service and namespace.
            - name: NANOFAAS_K8S_CALLBACKURL
              value: {{ .Values.controlPlane.callbackUrl | default (printf "http://%s.%s.svc.cluster.local:%v/v1/internal/executions" .Values.controlPlane.service.name (include "nanofaas.namespace" .) .Values.controlPlane.service.ports.http) | quote }}
            # Rendered even when empty: the empty string is the documented "no
            # explicit selection" case, not an unset one, and application.yml
            # resolves ${NANOFAAS_SCHEDULER_STRATEGY:} to whatever lands here.
            - name: NANOFAAS_SCHEDULER_STRATEGY
              value: {{ .Values.controlPlane.scheduler.strategy | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_INGRESS_BODY_BYTES
              value: {{ .Values.controlPlane.invocationCapacity.ingressBodyBytes | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_EXECUTIONS_GLOBAL
              value: {{ .Values.controlPlane.invocationCapacity.executionsGlobal | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_EXECUTIONS_PER_FUNCTION
              value: {{ .Values.controlPlane.invocationCapacity.executionsPerFunction | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_CANONICAL_INPUT_BYTES_GLOBAL
              value: {{ .Values.controlPlane.invocationCapacity.canonicalInputBytesGlobal | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_CANONICAL_INPUT_BYTES_PER_FUNCTION
              value: {{ .Values.controlPlane.invocationCapacity.canonicalInputBytesPerFunction | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_PHYSICAL_INPUT_COPY_BYTES_GLOBAL
              value: {{ .Values.controlPlane.invocationCapacity.physicalInputCopyBytesGlobal | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_PHYSICAL_INPUT_COPY_BYTES_PER_FUNCTION
              value: {{ .Values.controlPlane.invocationCapacity.physicalInputCopyBytesPerFunction | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_WAITERS_GLOBAL
              value: {{ .Values.controlPlane.invocationCapacity.waitersGlobal | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_WAITERS_PER_FUNCTION
              value: {{ .Values.controlPlane.invocationCapacity.waitersPerFunction | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_MAX_INPUT_REFERENCES
              value: {{ .Values.controlPlane.invocationCapacity.maxInputReferences | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_RETAINED_INPUT_MAX_DEPTH
              value: {{ .Values.controlPlane.invocationCapacity.retainedInputMaxDepth | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_RETAINED_INPUT_MAX_CONTAINER_ENTRIES
              value: {{ .Values.controlPlane.invocationCapacity.retainedInputMaxContainerEntries | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_RETAINED_INPUT_MAX_VISITED_NODES
              value: {{ .Values.controlPlane.invocationCapacity.retainedInputMaxVisitedNodes | int64 | quote }}
            - name: NANOFAAS_INVOCATION_CAPACITY_RETAINED_INPUT_MAX_BYTES_PER_EXECUTION
              value: {{ .Values.controlPlane.invocationCapacity.retainedInputMaxBytesPerExecution | int64 | quote }}
            # JAVA_TOOL_OPTIONS, not the Dockerfile's @jvm.options argfile: the event
            # loop count depends on this chart's own CPU limit above, not on the
            # image, and the JVM reads this env var itself at launch - no shell
            # expansion needed even with the distroless exec-form ENTRYPOINT.
            # controlPlane.jvm.ioWorkerCount overrides the auto-derived value when
            # set; empty (the default) derives it from resources.limits.cpu.
            - name: JAVA_TOOL_OPTIONS
              value: "-Dreactor.netty.ioWorkerCount={{ $ioWorkerCount }}"
            {{- with .Values.controlPlane.extraEnv }}
            {{- range $env := . }}
            - name: {{ $env.name | quote }}
              value: {{ $env.value | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/nanofaas
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.controlPlane.service.ports.actuator }}
            initialDelaySeconds: {{ .Values.controlPlane.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.controlPlane.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.controlPlane.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.controlPlane.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.controlPlane.service.ports.actuator }}
            initialDelaySeconds: {{ .Values.controlPlane.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.controlPlane.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.controlPlane.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.controlPlane.probes.liveness.failureThreshold }}
      volumes:
        - name: registry-data
          {{- if .Values.controlPlane.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.controlPlane.persistence.existingClaim | default "nanofaas-control-plane-data" | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
