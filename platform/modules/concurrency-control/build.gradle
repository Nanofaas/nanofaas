plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

def selectedQueue = gradle.ext.nanofaasSelectedControlPlaneModules.contains('sync-queue')
        ? 'sync-queue'
        : 'async-queue'

dependencies {
    implementation project(':common')
    implementation project(':control-plane')
    implementation project(':workload-metrics')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-webtestclient'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    // The selected queue provider supplies the real concurrency gate for the E2E test.
    testImplementation project(":control-plane-modules:${selectedQueue}")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    systemProperty 'nanofaas.queue.provider', selectedQueue
}
