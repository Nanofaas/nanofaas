name: nanofaas

services:
  control-plane:
    image: ${NANOFAAS_CONTROL_PLANE_IMAGE:-ghcr.io/miciav/nanofaas/control-plane:latest}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        NANOFAAS_CONTROL_PLANE_MODULES: ${NANOFAAS_CONTROL_PLANE_MODULES:-container-deployment-provider}
        # Export these to stamp the image with its provenance, which the builder cannot
        # determine itself (no .git, no git binary):
        #   NANOFAAS_BUILD_REVISION=$(git rev-parse HEAD) \
        #   NANOFAAS_BUILD_DIRTY=$(git status --porcelain --untracked-files=no | grep -q . && echo true || echo false) \
        #   docker compose build
        NANOFAAS_BUILD_REVISION: ${NANOFAAS_BUILD_REVISION:-}
        NANOFAAS_BUILD_DIRTY: ${NANOFAAS_BUILD_DIRTY:-}
    user: "0:0"
    environment:
      NANOFAAS_DEPLOYMENT_DEFAULT_BACKEND: container-local
      NANOFAAS_CONTAINER_LOCAL_RUNTIME_ADAPTER: docker-java
      NANOFAAS_CONTAINER_LOCAL_NETWORK_NAME: nanofaas
      NANOFAAS_CONTAINER_LOCAL_CALLBACK_URL: http://control-plane:8080/v1/internal/executions
      # Empty by default: every function gets its own CPU quota and they never compete. Set it
      # (e.g. "0-3") to put them all on the same cores, which is the only way a co-tenancy
      # measurement is about cores rather than about sharing a control plane.
      NANOFAAS_CONTAINER_LOCAL_CPUSET: ${NANOFAAS_CONTAINER_LOCAL_CPUSET:-}
      # Empty leaves the BUDGETED default, which scales with the cores the control
      # plane can see (44 on an 11-core host) and so never binds for a couple of
      # functions capped at 8 each — the mode would look identical to per-function
      # control because nothing was ever scarce.
      NANOFAAS_CONCURRENCY_CONTROL_TOTAL_BUDGET: ${NANOFAAS_CONCURRENCY_CONTROL_TOTAL_BUDGET:-}
      NANOFAAS_METRICS_PROFILE: advanced
      NANOFAAS_REGISTRY_PATH: /var/lib/nanofaas/functions.json
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control-plane-data:/var/lib/nanofaas
    networks:
      - nanofaas
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.9.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - nanofaas
    restart: unless-stopped

networks:
  nanofaas:
    name: nanofaas

volumes:
  prometheus-data:
  control-plane-data:
