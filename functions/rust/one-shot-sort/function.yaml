name: one-shot-sort-rust
image: nanofaas/rust-one-shot-sort:local
timeoutMs: 30000
concurrency: 1
executionMode: DEPLOYMENT
runtimeMode: HTTP
maxRetries: 0
env:
  FUNCTION_HANDLER: one-shot-sort
  NANOFAAS_MAX_CONCURRENT_HANDLERS: '1'
x-cli:
  build:
    context: ../../..
    dockerfile: functions/rust/one-shot-sort/Dockerfile
    push: false
catalog:
  family: one-shot-sort
  runtime: rust
  description: Deterministic sorting using the Rust SDK.
  defaultImage: 127.0.0.1:5000/nanofaas/rust-one-shot-sort:local
