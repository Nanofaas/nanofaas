server:
  port: 8080

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  server:
    port: 8081
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      enabled: true
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

nanofaas:
  registry:
    path: "${NANOFAAS_REGISTRY_PATH:build/nanofaas/functions.json}"
  metrics:
    profile: basic
  admin:
    runtime-config:
      enabled: false
  invocation-capacity:
    # Calibrated for the chart's minimum supported 512 MiB container. These are
    # simultaneous live-owner ceilings, not rate limits and not an RSS promise.
    ingress-body-bytes: 1048576
    executions-global: 4096
    executions-per-function: 512
    canonical-input-bytes-global: 134217728
    canonical-input-bytes-per-function: 33554432
    physical-input-copy-bytes-global: 67108864
    physical-input-copy-bytes-per-function: 16777216
    waiters-global: 8192
    waiters-per-function: 1024
    max-input-references: 64
    retained-input-max-depth: 32
    retained-input-max-container-entries: 16384
    retained-input-max-visited-nodes: 65536
    retained-input-max-bytes-per-execution: 1048576
  deployment:
    # Optional backend id to prefer when multiple managed deployment providers are available.
    default-backend: ""
    wakeup:
      timeout: 30s
      poll-interval: 250ms
      # A ready observation at or below this age bypasses forced provider reads and timer creation.
      ready-observation-max-age: 5s
  execution-store:
    # Retention of an outcome someone can still read: an ASYNC caller, which holds
    # nothing but the execution's id, or a retry replaying a key.
    ttl: 5m
    # Retention of the outcome of a keyless synchronous call, whose response has
    # already gone back on the caller's connection.
    sync-ttl: 30s
    # Absolute ceiling for a stuck execution (lost dispatch, callback that never arrived).
    max-lifetime: 30m
    # Derives the default byte budget below (when max-outcome-bytes = 0): the number of
    # compact 116-byte outcomes the store could hold before weighting was introduced.
    # Not enforced on its own - the outcome cache is bounded in BYTES, not in count.
    max-outcomes: 100000
    # The count cap for idempotency keys (bindings and tombstones), kept separate from
    # the outcome budget: evicting an outcome for capacity must never evict the
    # deduplication. Once the budget is exhausted a NEW keyed admission is refused (429)
    # before the dispatch; replays of keys already present stay servable. Size it as
    # `keyed admission rate x (maxLifetime + ttl)`.
    max-keys: 100000
    # The BYTE cap on retained outcomes - the only bound the outcome cache enforces. A
    # count cap would assume they all weigh the same: true for a compact outcome
    # (116 bytes), false for a readable one (ASYNC or keyed), which retains the
    # caller's payload. Measured: 20,000 outcomes at 64 KB occupy 1.28 GB, and at
    # max-outcomes=100000 that would be roughly 6 GB. With the byte budget the heap
    # stays flat as the payload size varies. An outcome whose size cannot be bounded
    # conservatively is declined (not retained) rather than silently under-priced.
    # Default (0 = derived): max-outcomes x 116 bytes, i.e. the same cost as before at
    # the limit. Raise it when retaining large payloads and wanting longer retention.
    max-outcome-bytes: 0
  http-client:
    # The dispatch connection pool. It used to be Reactor Netty's GLOBAL provider:
    # no stated budget and, above all, nobody to dispose it, so its connections
    # outlived the context that opened them. It is now a bean with a lifecycle, and
    # the values below state its per-destination budget and finite retention policy.
    #
    # The 45-second acquisition default matches Reactor Netty's on purpose: shortening it
    # looked like a large win, but the dispatcher already wraps the call in
    # .timeout(functionTimeout), which cancels the pending acquisition too.
    # Re-measured with that cancellation, 45 s / 5 s / 1 s are indistinguishable, so
    # the previous value stands
    # (docs/experiments/control-plane-tuning-2026-09/RESULTS.md).
    max-connections: 500
    pending-acquire-max-count: 0        # 0 = derived: twice max-connections
    pending-acquire-timeout-ms: 45000
    max-idle-time-ms: 30000
    max-life-time-ms: 0                 # 0 = disabled; opt in to connection rotation
    eviction-interval-ms: 5000
    inactive-pool-dispose-interval-ms: 5000
    pool-inactivity-ms: 30000
    # max-connections and pending-acquire-max-count apply to each concrete remote
    # destination, not across destinations. P07 remains the aggregate execution,
    # retained-input and waiter admission authority. Reactor Netty 1.3.6's
    # maxConnectionPools only logs a warning, so it is intentionally not exposed as a cap.
  defaults:
    timeoutMs: 30000
    concurrency: 4
    queueSize: 100
    maxRetries: 3
  rate:
    maxPerSecond: 1000000
  k8s:
    namespace: ""
    callbackUrl: "http://control-plane.default.svc.cluster.local:8080/v1/internal/executions"
  scaling:
    poll-interval-ms: 5000
    default-min-replicas: 1
    default-max-replicas: 10

sync-queue:
  enabled: true
  admission-enabled: true
  max-depth: 200
  max-estimated-wait: 2s
  max-queue-wait: 2s
  retry-after-seconds: 2
  throughput-window: 30s
  per-function-min-samples: 50
